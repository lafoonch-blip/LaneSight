<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Session feedback</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#00A8F5}a:hover{color:#00A8F5}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #001018; color: #F5F6FA; font-family: 'Roboto Condensed', system-ui, sans-serif; position: relative; overflow: hidden">
<div aria-hidden="true" style="position: absolute; left: 16px; right: 16px; top: 56px; display: flex; flex-direction: column; gap: 12px; opacity: 0.2">
<div style="font-size: 19px; font-weight: 600">Practice · Lane 14</div>
<div style="height: 120px; border-radius: 12px; background: #031B29"></div>
</div>
<div role="dialog" aria-modal="true" aria-labelledby="fb-title" style="position: absolute; left: 0; right: 0; bottom: 0; border-radius: 24px 24px 0 0; background: #031B29; border-top: 1px solid #153B51; padding: 20px 20px 34px; display: flex; flex-direction: column; gap: 16px">
<span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #153B51"></span>
<div style="display: flex; flex-direction: column; gap: 4px">
<span id="fb-title" style="font-size: 24px; font-weight: 600">How was this session in the app?</span>
<span style="font-size: 14px; color: #BFCBDD">24 shots · 52 min · dev build 0.1 (7)</span>
</div>
<div role="radiogroup" aria-label="Rating, 1 to 5" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{stars}}" as="s" hint-placeholder-count="5">
<button role="radio" aria-checked="{{s.checked}}" aria-label="{{s.label}}" onClick="{{s.pick}}" style="height: 56px; border-radius: 8px; background: {{s.bg}}; border: 1px solid {{s.border}}; color: {{s.fg}}; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="28" height="28" viewBox="0 0 24 24" fill="{{s.fill}}" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.4 7L12 17.6 5.8 21l1.4-7L2 9.3l7-.8z"></path></svg></button>
</sc-for>
</div>
<div style="display: flex; justify-content: space-between; font-size: 13px; color: #BFCBDD; margin-top: -8px"><span>Rough</span><span>{{ratingText}}</span><span>Great</span></div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 600">What's this about? <span style="font-weight: 500; color: #BFCBDD">(pick any)</span></span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{tags}}" as="t" hint-placeholder-count="6">
<button aria-pressed="{{t.on}}" onClick="{{t.toggle}}" style="height: 36px; padding: 0 12px; border-radius: 999px; background: {{t.bg}}; border: 1px solid {{t.border}}; color: {{t.fg}}; font-family: inherit; font-size: 14px; font-weight: 600">{{t.label}}</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="fb-text" style="font-size: 14px; font-weight: 600">Feedback, bugs or observations</label>
<textarea id="fb-text" rows="5" placeholder="e.g. Shot 7 said light but it looked high. Upload stalled twice on cellular." style="box-sizing: border-box; border-radius: 8px; background: #001018; border: 1px solid #153B51; color: #F5F6FA; padding: 12px; font-family: inherit; font-size: 14px; line-height: 1.4; resize: none"></textarea>
</div>
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: #BFCBDD; min-height: 44px"><input type="checkbox" checked style="width: 18px; height: 18px">Attach session diagnostics (timings, errors, versions)</label>
<a href="Summary.dc.html" style="text-decoration: none; height: 54px; border-radius: 8px; background: #00A8F5; color: #001018; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center">Submit</a>
<a href="Summary.dc.html" style="text-decoration: none; text-align: center; font-size: 14px; font-weight: 600; color: #BFCBDD; min-height: 32px">Skip</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { rating: 4, tags: { 'Bug': true, 'Metric looked wrong': true } }; }
  renderVals() {
    const r = this.state.rating;
    const words = ['', 'Rough', 'Meh', 'OK', 'Good', 'Great'];
    const stars = [1,2,3,4,5].map((n) => ({
      label: n + (n === 1 ? ' star' : ' stars'),
      checked: String(n === r),
      fill: n <= r ? '#FA923C' : 'none',
      fg: n <= r ? '#FA923C' : '#BFCBDD',
      bg: n <= r ? '#062132' : '#001018',
      border: n <= r ? '#153B51' : '#153B51',
      pick: () => this.setState({ rating: n })
    }));
    const names = ['Bug', 'Metric looked wrong', 'Advice', 'Camera / upload', 'Workflow', 'Idea'];
    const tags = names.map((name) => {
      const on = !!this.state.tags[name];
      return {
        label: name, on: String(on),
        bg: on ? '#0C2B40' : '#001018', border: on ? '#00A8F5' : '#153B51', fg: on ? '#00A8F5' : '#BFCBDD',
        toggle: () => this.setState({ tags: Object.assign({}, this.state.tags, { [name]: !on }) })
      };
    });
    return { stars, tags, ratingText: words[r] };
  }
}
</script>
</body>
</html>
