<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Upload video</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7FB2FF}a:hover{color:#B3D1FF}
</style>
</helmet>
<div style="width: 390px; height: 1000px; box-sizing: border-box; background: #060C1C; color: #F2F5FA; font-family: Inter, system-ui, sans-serif; padding: 56px 16px 32px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 12px">
<a href="Lab.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 12px; background: #0D1830; border: 1px solid #1C2A4A; color: #C9D4EA; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<span style="font-size: 20px; font-weight: 700">Analyze a video</span>
</div>
<div style="border-radius: 16px; background: #0D1830; border: 1px solid #1C2A4A; padding: 12px; display: flex; gap: 12px; align-items: center">
<span role="img" aria-label="Selected clip thumbnail" style="width: 88px; height: 120px; border-radius: 10px; background: #1A2440; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #8A97B2; flex-shrink: 0">clip</span>
<div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1">
<span style="font-size: 15px; font-weight: 700">IMG_8851.MOV</span>
<span style="font-size: 12px; color: #9AA8C3">Oct 21 · 7:48 pm · 0:24</span>
<span style="font-size: 12px; color: #7BE8B5">1080p · 120 fps · SDR ✓</span>
<button style="align-self: flex-start; height: 34px; padding: 0 12px; border-radius: 10px; background: #13213F; border: 1px solid #24324F; color: #F2F5FA; font-family: inherit; font-size: 12px; font-weight: 600; margin-top: 4px">Choose another</button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 1px; color: #9AA8C3">WHAT'S IN THIS CLIP?</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button aria-pressed="true" style="text-align: left; border-radius: 14px; padding: 12px; background: #13284F; border: 2px solid #2F7DFF; color: #F2F5FA; font-family: inherit; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 14px; font-weight: 700">Shot</span><span style="font-size: 11px; color: #B9C6E0">Ball &amp; lane</span></button>
<button aria-pressed="false" style="text-align: left; border-radius: 14px; padding: 12px; background: #0D1830; border: 1px solid #1C2A4A; color: #F2F5FA; font-family: inherit; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 14px; font-weight: 700">Form</span><span style="font-size: 11px; color: #9AA8C3">Approach &amp; swing</span></button>
</div>
</div>
<div style="border-radius: 16px; background: #0D1830; border: 1px solid #1C2A4A; display: flex; flex-direction: column">
<button style="padding: 0 14px; min-height: 48px; display: flex; align-items: center; justify-content: space-between; background: transparent; border: 0; border-bottom: 1px solid #1C2A4A; color: #F2F5FA; font-family: inherit; font-size: 14px"><span>Ball</span><span style="color: #9AA8C3">[Ball 1] ›</span></button>
<button style="padding: 0 14px; min-height: 48px; display: flex; align-items: center; justify-content: space-between; background: transparent; border: 0; border-bottom: 1px solid #1C2A4A; color: #F2F5FA; font-family: inherit; font-size: 14px"><span>Oil pattern</span><span style="color: #9AA8C3">House shot ›</span></button>
<button style="padding: 0 14px; min-height: 48px; display: flex; align-items: center; justify-content: space-between; background: transparent; border: 0; color: #F2F5FA; font-family: inherit; font-size: 14px"><span>Add to session</span><span style="color: #9AA8C3">New practice session ›</span></button>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 1px; color: #9AA8C3">YOUR TARGET FOR THIS SHOT (OPTIONAL)</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button style="height: 52px; border-radius: 12px; background: #0D1830; border: 1px solid #24324F; color: #F2F5FA; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-size: 11px; color: #9AA8C3">Feet</span><span style="font-weight: 700">25</span></button>
<button style="height: 52px; border-radius: 12px; background: #0D1830; border: 1px solid #24324F; color: #F2F5FA; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-size: 11px; color: #9AA8C3">Arrows</span><span style="font-weight: 700">12</span></button>
<button style="height: 52px; border-radius: 12px; background: #0D1830; border: 1px solid #24324F; color: #F2F5FA; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-size: 11px; color: #9AA8C3">Breakpoint</span><span style="font-weight: 700">7</span></button>
</div>
<span style="font-size: 12px; color: #8A97B2">Without a target, Accuracy is skipped for this shot.</span>
</div>
<div style="border-radius: 14px; background: #0D1830; border: 1px solid #1C2A4A; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 600">Was a sensor in the ball?</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button aria-pressed="true" style="height: 44px; border-radius: 12px; background: #2F7DFF; border: 0; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700">No</button>
<button aria-pressed="false" style="height: 44px; border-radius: 12px; background: #13213F; border: 1px solid #24324F; color: #F2F5FA; font-family: inherit; font-size: 14px; font-weight: 600">Yes · [My sensor]</button>
</div>
</div>
<a href="Shot.dc.html" style="text-decoration: none; height: 56px; border-radius: 16px; background: #2F7DFF; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-top: auto">Analyze</a>
<span style="text-align: center; font-size: 12px; color: #8A97B2">One shot per clip for now. Results in about 2 minutes.</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
