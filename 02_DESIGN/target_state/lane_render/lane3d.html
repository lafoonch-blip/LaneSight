<script type="module">

function tex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=16;t.wrapS=t.wrapT=THREE.RepeatWrapping;if(rep)t.repeat.set(...rep);return t;}
const wood=(g,w,h)=>{const n=39,bw=w/n;for(let i=0;i<n;i++){const v=Math.abs(Math.sin(i*12.9898)*43758.5453)%1;const d=v*14-7;g.fillStyle=`hsl(${27+d*0.4},${62}%,${47+d*0.7}%)`;g.fillRect(i*bw,0,bw,h);for(let k=0;k<60;k++){g.fillStyle=`rgba(110,60,25,${Math.random()*0.06})`;g.fillRect(i*bw+Math.random()*bw,Math.random()*h,1,30+Math.random()*120);}g.fillStyle='rgba(50,28,10,.45)';g.fillRect(i*bw,0,1.2,h);}};

const plane=(w,d,m,x,y,z)=>{const p=new THREE.Mesh(new THREE.PlaneGeometry(w,d),m);p.rotation.x=-Math.PI/2;p.position.set(x,y,z);p.receiveShadow=true;scene.add(p);return p;};

  box(0.42,0.14,62,new THREE.MeshStandardMaterial({color:0x0a111b,roughness:.95,metalness:0,envMapIntensity:0.1}),cx+PITCH/2,0.05,31);

  const dark=new THREE.MeshBasicMaterial({color:0x2a1608});

  plane(LANE+2*GUT,0.08,new THREE.MeshStandardMaterial({color:0x1a0a06}),cx,0.005,0);

  const pts=[[0,0],[.09,0],[.15,.12],[.195,.33],[.2,.42],[.18,.58],[.12,.74],[.08,.86],[.078,.95],[.095,1.06],[.098,1.12],[.08,1.2],[.04,1.245],[0,1.25]].map(a=>new THREE.Vector2(a[0],a[1]));
  const pg=new THREE.LatheGeometry(pts,48),pmat=new THREE.MeshPhysicalMaterial({color:0xf7f8fb,roughness:.22,clearcoat:1}),smat=new THREE.MeshStandardMaterial({color:0xd0263a,roughness:.35});
  [[0],[-.5,.5],[-1,0,1],[-1.5,-.5,.5,1.5]].forEach((r,ri)=>r.forEach(px=>{const p=new THREE.Mesh(pg,pmat);p.position.set(cx+px,0,60+ri*0.866);p.castShadow=true;scene.add(p);[0.84,0.9].forEach(y=>{const t=new THREE.Mesh(new THREE.TorusGeometry(0.083,0.013,8,32),smat);t.rotation.x=Math.PI/2;t.position.set(cx+px,y,60+ri*0.866);scene.add(t);});}));
  plane(LANE+2*GUT,4,laneMat,cx,0,62);
  box(LANE+2*GUT+0.42,3.4,1.0,new THREE.MeshStandardMaterial({color:0x07101c,roughness:.6}),cx,4.9,63.4);
  box(LANE+2*GUT,0.06,0.06,new THREE.MeshStandardMaterial({color:0x6ad1ff,emissive:0x3fb8ff,emissiveIntensity:1.6}),cx,3.15,62.9);
  box(LANE+2*GUT+0.42,7,0.4,new THREE.MeshStandardMaterial({color:0x03070e}),cx,3.5,66);
  const sl=new THREE.SpotLight(0xfff2dc,90,20,0.7,0.5,1.4);sl.position.set(cx,4.6,58);sl.target.position.set(cx,0,61.2);sl.castShadow=true;sl.shadow.mapSize.set(1024,1024);scene.add(sl,sl.target);
}
[-1,1].forEach(s=>box(0.5,4,80,new THREE.MeshStandardMaterial({color:0x0a1626,roughness:.7}),s*(1.5*PITCH+0.4),2,30));
scene.add(new THREE.HemisphereLight(0xa9c4ff,0x140c06,0.6));
const dl=new THREE.DirectionalLight(0xffeedd,2.1);dl.position.set(2,25,-40);dl.target.position.set(0,0,30);scene.add(dl,dl.target);
// ---- shot paths ----
const deg=a=>Math.tan(a*Math.PI/180)*12/1.0641;
function herm(pts,n=60){const o=[];for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],h=b.z-a.z;for(let k=0;k<=n;k++){if(i>0&&k===0)continue;const t=k/n,t2=t*t,t3=t2*t;o.push([a.z+t*h,(2*t3-3*t2+1)*a.b+(t3-2*t2+t)*h*a.m+(-2*t3+3*t2)*b.b+(t3-t2)*h*b.m]);}}return o;}
const mk=s=>herm(s.map(p=>({z:p[0],b:p[1],m:p[2]==='e'?deg(p[3]):p[2]})));
let ACT=mk(DATA.act);const TGT=mk(DATA.tgt);if(DATA.cut){ACT=ACT.filter(p=>p[0]<=DATA.cut);const m=new THREE.Mesh(new THREE.PlaneGeometry(LANE+2*GUT+0.4,66-DATA.cut),new THREE.MeshBasicMaterial({color:0x020a14,transparent:true,opacity:0.62,depthWrite:false}));m.rotation.x=-Math.PI/2;m.position.set(0,0.03,DATA.cut+(66-DATA.cut)/2);m.renderOrder=5;scene.add(m);}
function ribbon(pts,width,y,color,op){const pos=[],idx=[];pts.forEach((p,i)=>{const x=bx(p[1]),z=p[0];const nx=i<pts.length-1?pts[i+1]:p,pv=i>0?pts[i-1]:p;const dx=bx(nx[1])-bx(pv[1]),dz=nx[0]-pv[0];const L=Math.hypot(dx,dz)||1;const ox=-dz/L*width/2,oz=dx/L*width/2;pos.push(x+ox,y,z+oz,x-ox,y,z-oz);if(i<pts.length-1){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2);}});
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color,transparent:true,opacity:op,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending}));scene.add(m);return m;}
const v3=p=>new THREE.Vector3(bx(p[1]),0.06,p[0]);

{const pos=[],idx=[];let n=0;for(let z=0;z<=(DATA.cut||60);z+=0.5){pos.push(bx(bAt(TGT,z)),0.01,z,bx(bAt(ACT,z)),0.01,z);if(z>0){const a=(n-1)*2;idx.push(a,a+1,a+2,a+1,a+3,a+2);}n++;}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);scene.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:0xf5cd31,transparent:true,opacity:0.35,depthWrite:false,side:THREE.DoubleSide})));}
