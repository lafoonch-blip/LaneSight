<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LaneSight runner</title>
<style>
/* runner v2 design (runner_v2_mock). System fonts so it works offline at the lanes. */
:root{
  --bg:#070D18; --card:#0E1626; --cardline:#1B2840; --sub:#111C2F; --subline:#1E2C45; --field:#0B1322;
  --ink:#E6ECF5; --ink2:#C9D3E2; --muted:#9AA8BC; --dim:#8592A6; --dimmer:#6E7C92;
  --blue:#1677FF; --blue2:#2E9BFF; --sky:#3F8CFF; --green:#43D893; --green2:#22C55E; --yellow:#F2C94C; --red:#EF4444;
  --purple:#C99BFF; --teal:#5FD8CB; --amber:#F5BC4E; --loft:#F27A7A;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
a{color:var(--blue2);text-decoration:none}a:hover{color:#9AD7FF}
h1,h2,h3{margin:0}
.card{background:var(--card);border:1px solid var(--cardline);border-radius:12px;box-sizing:border-box;min-width:0}
.sub{background:var(--sub);border:1px solid var(--subline);border-radius:10px;box-sizing:border-box;min-width:0}
.b{font:700 9px/1 var(--sans);letter-spacing:.5px;border-radius:3px;padding:3px 4px;text-transform:uppercase;white-space:nowrap}
.ok{background:#11392A;color:var(--green)}.est{background:#3A3010;color:var(--yellow)}.na{background:#212A38;color:#8592A6}.ruby{background:#17263E;color:#7FB2E8}
.tabs{display:inline-flex;border:1px solid var(--subline);border-radius:8px;overflow:hidden;background:#0B1322}
.tab{background:transparent;border:0;border-right:1px solid var(--subline);color:var(--ink2);padding:0 14px;height:34px;font:500 13px var(--sans);cursor:pointer;white-space:nowrap}
.tab:last-child{border-right:0}
.tab.on{background:var(--blue);color:#fff}
.pill{background:#0B1322;border:1px solid var(--subline);color:var(--ink);border-radius:7px;height:30px;padding:0 10px;font:500 12px var(--sans);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.pill:hover{border-color:#2d436b}
.pill.on{background:var(--blue);border-color:var(--blue);color:#fff}
.pill:disabled{opacity:.5;cursor:default}
.nav{display:flex;align-items:center;gap:12px;padding:0 14px;height:40px;border-radius:8px;color:var(--ink2);text-decoration:none;font-size:14px;cursor:pointer}
.nav:hover{background:var(--sub);color:#fff}
.nav.on{background:var(--blue);color:#fff}
.fld{background:var(--field);border:1px solid var(--subline);border-radius:8px;color:var(--ink);padding:8px 9px;font:500 14px var(--sans);width:100%;box-sizing:border-box}
.fld:focus{outline:none;border-color:var(--blue2)}
label.lbl{display:block;font-size:12px;color:var(--muted);margin:0 0 3px}
.muted{color:var(--muted)}.dim{color:var(--dim)}.small{font-size:12px}.err{color:var(--red)}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.statpill{display:inline-flex;align-items:center;gap:7px;font-size:12px;border-radius:999px;padding:6px 11px}
.spin{width:11px;height:11px;border:2px solid #4A3D15;border-top-color:var(--yellow);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.warnbox{background:#3a2b0e;border:1px solid #6b5418;color:#f5d98a;border-radius:8px;padding:8px 10px;font-size:13px}
.spinbig{width:30px;height:30px;border:3px solid var(--cardline);border-top-color:var(--blue2);border-radius:50%;animation:s 1s linear infinite;margin:0 auto 10px}
.kbd{font:500 11px var(--mono);color:var(--muted);border:1px solid var(--subline);border-radius:4px;padding:1px 4px}
.ph{display:flex;align-items:center;justify-content:center;min-height:200px;color:var(--dim);font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
@media (max-width:980px){.grid2{grid-template-columns:1fr}}
#drop{position:fixed;inset:0;background:#1677FFcc;display:none;align-items:center;justify-content:center;font-size:26px;font-weight:700;z-index:10}
</style>
</head>
<body>
<header style="display:flex;align-items:center;gap:14px;padding:12px 22px;border-bottom:1px solid #141F33;background:#0A1220;flex-wrap:wrap">
  <div style="display:flex;align-items:center;gap:10px">
    <svg width="38" height="24" viewBox="0 0 38 24" aria-hidden="true"><path d="M2 21 L15 3 M36 21 L23 3" stroke="#E6ECF5" stroke-width="2.6" fill="none" stroke-linecap="round"></path><path d="M8 21 Q19 2 30 21" stroke="#2E9BFF" stroke-width="2.6" fill="none" stroke-linecap="round"></path></svg>
    <span style="font-size:24px;font-weight:700;letter-spacing:-.3px">Lane<span style="color:#2E9BFF">Sight</span></span>
  </div>
  <div style="flex:1"></div>
  <div id="hstatus" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"></div>
  <button id="speechBtn" class="pill" type="button">🔊 Speech</button>
  <div style="display:flex;align-items:center;gap:9px;margin-left:4px">
    <span style="width:32px;height:32px;border-radius:50%;background:#1E3A66;display:grid;place-items:center;font-weight:700;font-size:13px">S</span>
    <span style="font-size:14px">Shayne</span>
  </div>
</header>
<div style="display:flex;flex-wrap:wrap;min-height:calc(100vh - 49px)">
  <nav aria-label="Main" style="flex:0 0 168px;padding:16px 10px;border-right:1px solid #141F33;background:#0A1220;display:flex;flex-direction:column;gap:4px">
    <a class="nav on" aria-current="page"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Session</a>
    <a class="nav" title="History — coming soon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Sessions</a>
    <a class="nav" title="Cross-session trends — coming soon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>Analysis</a>
    <a class="nav" title="Balls — coming soon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><circle cx="10" cy="9" r="1.2"></circle><circle cx="14" cy="9" r="1.2"></circle><circle cx="12" cy="12.5" r="1.2"></circle></svg>Arsenal</a>
    <a class="nav" title="Settings — coming soon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"></path><circle cx="12" cy="12" r="3.5"></circle></svg>Settings</a>
    <div style="flex:1"></div>
    <div style="font-size:11px;color:var(--dimmer);padding:0 8px;line-height:1.5">Clips: AirDrop to this Mac or drag onto the page</div>
  </nav>
  <main id="app" style="flex:999 1 900px;min-width:0;padding:16px 20px 22px"></main>
</div>
<div id="drop">Drop clip to analyze</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S = null, selected = null, follow = true, editing = false, range = 'all', shotFilter = 'all', shotTab = 'overview', transTab = 'traffic', inputMode = null, showSpeed = true, showRev = true, patternsLib = null;
let view = 'latest';   // top-level page: latest | shots | overview | transition
let showOil = true, showTarget = true, showBoards = true, showArrows = false;   // Latest Shot lane-view toggles
const VIEWS = [['latest', 'Latest Shot'], ['shots', 'Shots'], ['overview', 'Session Overview'], ['transition', 'Lane Transition']];
const VIEW_SUB = {latest: 'Your most recent shot — metrics, line and the next move.', shots: 'Every shot this session.', overview: 'Key metrics, trends and performance for your session.', transition: "How the lane is changing and what to do about it."};
const PIN_ROWS = [[7,8,9,10],[4,5,6],[2,3],[1]];
const SENSOR_FIELDS = [['speed_mph','Speed',0.1],['rev_rate_rpm','Revs',1],['loft_ft','Loft ft',0.1],['axis_tilt_deg','Tilt °',1],['axis_rotation_deg','Rotation °',1],['breakpoint_ft','Breakpt ft',1]];

async function api(path, opts={}) {
  const r = await fetch(path, {headers:{'Content-Type':'application/json'}, ...opts,
    body: opts.body && typeof opts.body !== 'string' && !(opts.body instanceof FormData) ? JSON.stringify(opts.body) : opts.body});
  if (!r.ok) { const t = await r.text(); let m = t; try { m = JSON.parse(t).detail } catch(e){} alert(m); throw new Error(m); }
  return r.json();
}
async function load() { S = await api('/api/state'); render(); }
function connect() {
  const es = new EventSource('/api/events');
  es.onmessage = () => { if (!editing) load(); };
  es.onerror = () => { es.close(); setTimeout(connect, 2000); };
}

const fmtTime = iso => iso ? new Date(iso).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}) : '';
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString([], {month:'numeric', day:'numeric', year:'numeric'}) : '';
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const metricVal = (c, k) => { const m = (c.metrics || []).find(x => x.key === k); return m && m.value != null ? m.value : null; };
const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
const sd = a => { if (a.length < 2) return null; const m = avg(a); return Math.sqrt(avg(a.map(x=>(x-m)**2))); };
const pct = (a,b) => b ? Math.round(100*a/b) : null;
function durStr(a, b) { if (!a) return ''; const ms = (b?new Date(b):new Date()) - new Date(a); const m = Math.max(0, Math.round(ms/60000)); return m >= 60 ? `${Math.floor(m/60)}h ${m%60}m` : `${m}m`; }

function current() {
  if (!S || !S.cards.length) return null;
  if (follow || !S.cards.find(c => c.id === selected)) selected = S.cards[S.cards.length-1].id;
  return S.cards.find(c => c.id === selected);
}
function rangeCards() {
  const cs = S.cards;
  if (range === 'last5') return cs.slice(-5);
  if (range === 'first') return cs.slice(0, Math.ceil(cs.length/2));
  if (range === 'second') return cs.slice(Math.ceil(cs.length/2));
  return cs;
}
// one shot's outcome mark: X strike / "/" spare made / "–" open-or-leave
function shotMark(c) {
  if (c.status !== 'done' || !c.pins) return null;
  if (c.kind === 'first') return c.pins.strike ? 'X' : '–';
  return c.pins.strike ? '/' : '–';
}
function shotTag(c) {
  const m = shotMark(c); return m === 'X' ? 'strike' : m === '/' ? 'spare' : m === '–' ? 'open' : (c.status === 'failed' ? 'failed' : 'pending');
}

function render() {
  const sess = S.session;
  $('#speechBtn').className = 'pill' + (S.speech ? ' on' : '');
  $('#speechBtn').disabled = !S.speech_available;
  $('#speechBtn').textContent = S.speech ? '🔊 Speech on' : '🔇 Speech off';
  renderHeaderStatus();
  if (!sess) { renderStart(); return; }
  const c = current();
  $('#app').innerHTML = `
    ${S.watch_error ? `<div class="warnbox" style="margin-bottom:12px">${esc(S.watch_error)}</div>` : ''}
    ${renderTitle(sess)}
    <div class="tabs" role="tablist" aria-label="View" style="margin:16px 0 4px">
      ${VIEWS.map(([k, l]) => `<button class="tab ${view === k ? 'on' : ''}" role="tab" aria-selected="${view === k}" data-view="${k}" type="button">${l}</button>`).join('')}
    </div>
    <div id="viewbody">${renderView(c)}</div>`;
  bind(sess, c);
}

/* ---------- view routing: one full-width page at a time (reference images are per-page, not a 2x2 grid) ---------- */
function renderView(c) {
  if (view === 'shots') return `<section class="card" style="padding:16px">${renderShots()}</section>`;
  if (view === 'overview') return `<section class="card" style="padding:16px 16px 12px">${renderOverview()}</section>`;
  if (view === 'transition') return `<section class="card" style="padding:16px">${renderTransition()}</section>`;
  return `<section class="card" style="padding:16px">${renderLatest(c)}</section>`;
}
function setView(v) { view = v; const b = $('#viewbody'); if (b) { b.innerHTML = renderView(current()); bind(S.session, current()); }
  document.querySelectorAll('[data-view]').forEach(t => { const on = t.dataset.view === v; t.classList.toggle('on', on); t.setAttribute('aria-selected', on); }); }

/* ---------- title row ---------- */
function renderTitle(sess) {
  const st = S.stats || {};
  const name = sess.name || `${cap(sess.kind || 'practice')} ${fmtDate(sess.started_at)}`;
  const meta = [
    [sess.center, sess.lane != null ? `lane ${sess.lane}` : null].filter(Boolean).join(' · ') || null,
    sess.pattern_name ? esc(sess.pattern_name) + (sess.pattern_length_ft ? ' ' + sess.pattern_length_ft + ' ft' : '') : null,
    `${st.shots || 0} shot${st.shots === 1 ? '' : 's'}`,
    durStr(sess.started_at, sess.ended_at),
    sess.ball_name ? esc(sess.ball_name) + (sess.ball_weight_lb ? ' ' + sess.ball_weight_lb + ' lb' : '') : null,
    cap(sess.kind),
  ].filter(Boolean);
  return `<div style="display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px">
    <div style="display:flex;flex-direction:column;gap:6px">
      <div style="display:flex;align-items:center;gap:10px"><h1 style="font-size:24px;font-weight:600">${esc(name)}</h1>
        <button id="editName" type="button" aria-label="Edit session name" style="background:none;border:0;color:var(--ink2);cursor:pointer;padding:4px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></button></div>
      <div style="display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink2)">
        ${meta.map((m,i) => `${i?'<span style="color:#3A4A63">|</span>':''}<span>${m}</span>`).join('')}</div>
    </div>
    <div style="flex:1"></div>
    <button class="pill" id="editSess" type="button" style="height:38px;padding:0 14px;font-size:13px">Change ball / pattern</button>
    <a class="pill" href="/api/sessions/${sess.id}/export.csv" style="height:38px;padding:0 14px;font-size:13px;text-decoration:none">Export CSV</a>
    <button class="pill" id="endBtn" type="button" style="height:38px;padding:0 14px;font-size:13px">End session</button>
  </div>`;
}

/* ---------- header status ---------- */
function renderHeaderStatus() {
  const el = $('#hstatus'); if (!S.session) { el.innerHTML = ''; return; }
  const watch = S.watch_error
    ? `<span class="statpill" style="color:var(--red);border:1px solid #5a2222"><span class="dot" style="background:var(--red)"></span>Watch error</span>`
    : `<span class="statpill" style="color:var(--ink2);border:1px solid var(--subline)"><span class="dot" style="background:var(--green)"></span>Watching ${esc(shortPath(S.watch_dir))}</span>`;
  const proc = S.cards.find(c => c.status === 'processing');
  let q = '';
  if (proc) { const step = procStep(proc); q = `<span class="statpill" style="color:var(--yellow);border:1px solid #4A3D15"><span class="spin"></span>Analyzing shot ${proc.n}${step ? ' · ' + esc(step) : ''}</span>`; }
  else if (S.queue) q = `<span class="statpill" style="color:var(--yellow);border:1px solid #4A3D15"><span class="spin"></span>${S.queue} queued</span>`;
  el.innerHTML = watch + q;
}
const shortPath = p => { if (!p) return ''; const parts = p.replace(/\/$/,'').split('/'); return parts.slice(-1)[0]; };
const STEP_LABELS = [[/^probe/,'probing'],[/trimmed|no trim|window/,'finding the shot'],[/hdr/,'converting HDR'],[/ref frame/,'stabilizing'],
  [/^vp|lanes consistent/,'finding lanes'],[/blobs|extended track/,'tracking the ball'],[/impact/,'finding impact'],[/refine/,'refining'],[/pins/,'reading pins'],[/rev/,'rev rate']];
function stepLabel(msg) { const m = String(msg).toLowerCase(); if (m.includes('kept trimmed')) return 'finishing';
  for (const [re, lab] of STEP_LABELS) if (re.test(m)) return lab; return 'working'; }
function procStep(c) { const steps = (c.timings || {}).steps; return steps && steps.length ? stepLabel(steps[steps.length-1].msg) : ''; }

/* ---------- panels (filled in later steps) ---------- */
function panelHead(title, right='') {
  return `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px"><h2 style="font-size:17px;font-weight:600">${title}</h2><div style="flex:1"></div>${right}</div>`;
}
function kdelta(cur, was, dec, suf) {
  if (cur == null || was == null) return { text: '', color: '#9AA8BC' };
  const d = cur - was; return { text: `${d >= 0 ? '↑' : '↓'} ${Math.abs(d).toFixed(dec)} ${suf}`, color: d > 0 ? '#43D893' : d < 0 ? '#F27A7A' : '#9AA8BC' };
}
function renderOverview() {
  const cards = rangeCards();
  const range_tabs = [['all','Total'],['first','First Half'],['second','Second Half'],['last5','Last 5']]
    .map(([v,l]) => `<button class="tab ${range===v?'on':''}" data-range="${v}" type="button">${l}</button>`).join('');
  const head = panelHead('Session Overview', `<div class="tabs" role="group" aria-label="Range">${range_tabs}</div>`);
  const first = cards.filter(c => c.status==='done' && c.kind==='first' && c.pins);
  const spare = cards.filter(c => c.status==='done' && c.kind==='spare' && c.pins);
  const strikes = first.filter(c => c.pins.strike), made = spare.filter(c => c.pins.strike);
  const col = k => first.map(c => metricVal(c,k)).filter(v => v!=null);
  const aSpeed = avg(col('ball_speed')), aRev = avg(col('rev_rate'));
  const strikePct = pct(strikes.length, first.length), sparePct = pct(made.length, spare.length);
  const prev = (range === 'all' && S.prev_stats) ? S.prev_stats : null;
  const downs = first.map(c => 10 - ((c.pins.standing || []).length)).filter(v => v >= 0);
  const aPins = avg(downs);
  const tiles = [
    tile('Average Speed', aSpeed!=null?aSpeed.toFixed(1):'—', 'MPH', '✓', 'ok', prev ? kdelta(aSpeed, (prev.averages.ball_speed||{}).mean, 1, 'vs last session') : null, `${first.length} first ball${first.length===1?'':'s'}`),
    tile('Average Rev Rate', aRev!=null?Math.round(aRev):'—', 'RPM', 'est', 'est', prev ? kdelta(aRev, (prev.averages.rev_rate||{}).mean, 0, 'vs last session') : null, 'surface periodicity'),
    tile('Strikes', strikePct!=null?strikePct+'%':'—', `(${strikes.length}/${first.length})`, '✓', 'ok', prev ? kdelta(strikePct, prev.strike_pct, 0, '% vs last session') : null),
    tile('Spares', sparePct!=null?sparePct+'%':'—', `(${made.length}/${spare.length})`, '✓', 'ok', prev ? kdelta(sparePct, prev.spare_pct, 0, '% vs last session') : null),
    tile('Average Pins', aPins!=null?aPins.toFixed(1):'—', 'pins', '✓', 'ok', null, downs.length?`High ${Math.max(...downs)} · Low ${Math.min(...downs)}`:''),
  ];
  const checks = `<div style="display:flex;gap:16px;font-size:13px;align-items:center;margin-top:2px">
    <label style="display:inline-flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="ckSpeed" ${showSpeed?'checked':''} style="accent-color:#1677FF;width:15px;height:15px">Speed (MPH)</label>
    <label style="display:inline-flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="ckRev" ${showRev?'checked':''} style="accent-color:#22C55E;width:15px;height:15px">Rev Rate (RPM) <span class="b est">est</span></label></div>`;
  const sub = `<div style="font-size:13px;color:var(--muted);margin:-4px 0 10px">Key metrics, trends and performance for your session.</div>`;
  const extra = (renderConsistency(first) || renderScatter(first)) ?
    `<div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:14px">${renderConsistency(first)}${renderScatter(first)}</div>` : '';
  return head + sub + `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px">${tiles.join('')}</div>${checks}${overviewChart(cards)}${extra}`;
}
function ring(pct, color, big, small) {
  const r = 26, c = 2 * Math.PI * r, off = c * (1 - Math.max(0, Math.min(100, pct)) / 100);
  return `<div style="display:flex;flex-direction:column;align-items:center;gap:5px">
    <svg width="74" height="74" viewBox="0 0 74 74"><circle cx="37" cy="37" r="${r}" fill="none" stroke="#1E2C45" stroke-width="7"></circle>
      <circle cx="37" cy="37" r="${r}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 37 37)"></circle>
      <text x="37" y="42" fill="#E6ECF5" font-size="16" font-weight="700" text-anchor="middle" class="num">${big}</text></svg>
    <div style="font-size:12px;color:#C9D3E2;text-align:center;line-height:1.3">${small}</div></div>`;
}
// consistency score from a real coefficient of variation (tighter spread -> higher); the SD itself is shown too
function consScore(sd, mean) { return (sd == null || !mean) ? null : Math.round(100 * Math.max(0, 1 - 5 * Math.abs(sd / mean))); }
function renderConsistency(first) {
  const sp = first.map(c => metricVal(c, 'ball_speed')).filter(v => v != null);
  const rv = first.map(c => metricVal(c, 'rev_rate')).filter(v => v != null);
  const cons = (S.stats || {}).consistency || {};
  const rep = cons.repeatability_score, disp = cons.dispersion_boards || {};

  const pill = (v, bg, fg, suf='') => `<span class="num" style="font-size:13px;padding:5px 0;border-radius:6px;background:${bg};color:${fg}">${v==null?'—':v}${v!=null&&suf?' '+suf:''}</span>`;
  const latestId = cs[cs.length-1].id;
  const rows = [...cs].reverse().filter(match).map(c => {
    const mark = shotMark(c);
    const chipC = mark==='X'?['#22C55E','#0F2E1C']:mark==='/'?['#F2C94C','#33290D']:mark==='–'?['#EF4444','#3A1414']:['#8592A6','#1A2436'];
    const leave = c.pins && !c.pins.strike ? (c.pins.standing||[]).join('-') : '';
    const title = c.status!=='done' ? cap(c.status) : !c.pins ? 'Pins not read' : c.pins.strike ? (c.kind==='spare'?'Spare made':'Strike') : 'Leave '+leave;
    const bp = metricVal(c,'breakpoint_board'), entry = metricVal(c,'entry_board');
    const tgt = ((c.intent||{}).breakpoint_board) ?? ((S.session.intent||{}).breakpoint_board);
    const rev = metricVal(c,'rev_rate'), speed = metricVal(c,'ball_speed'), ang = metricVal(c,'entry_angle'), loft = metricVal(c,'loft'), power = (c.power||{}).value;
    const bar = `<span style="position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,#7C6CF2 0%,#4FA3F7 45%,#6EE07A 100%);opacity:.9;align-self:center">
      ${tgt!=null?`<span style="position:absolute;top:-2px;bottom:-2px;left:${pos(tgt).toFixed(1)}%;border-left:2px dashed #0B1322"></span>`:''}
      ${bp!=null?`<span style="position:absolute;top:-3px;bottom:-3px;width:2px;background:#F3F6FA;left:${pos(bp).toFixed(1)}%"></span>`:''}
      ${entry!=null?`<span style="position:absolute;top:1px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#FFD84A;left:${pos(entry).toFixed(1)}%"></span>`:''}</span>`;
    const rowStyle = `display:grid;grid-template-columns:${cols};gap:0 8px;align-items:center;padding:6px;text-align:center;border-radius:8px;cursor:pointer;` + (c.id===selected?'background:#10264A;outline:1px solid #1677FF':'background:#0B1322');
    return `<div data-shot="${c.id}" style="${rowStyle}">
      <span title="${esc(title)}" style="width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-size:15px;font-weight:800;color:${chipC[0]};background:${chipC[1]};border:1px solid ${chipC[0]}55;justify-self:center">${mark||(c.status==='failed'?'!':'·')}</span>
      <span style="text-align:left;font-size:13px;white-space:nowrap">${fmtTime(c.created_at)}<span style="display:block;font-size:10.5px;color:#8592A6">#${c.n}${leave?' · '+leave:''}</span></span>
      ${bar}
      ${pill(rev!=null?Math.round(rev):null,'#2E1C45','#C99BFF','RPM')}${pill(speed!=null?speed.toFixed(2):null,'#142C42','#6CC4FF','MPH')}
      ${pill(ang!=null?ang.toFixed(1)+'°':null,'#0F3434','#5FD8CB')}${pill(entry!=null?entry.toFixed(1):null,'#17351A','#6EE07A')}
      ${pill(power!=null?power:null,'#3A2C10','#F5BC4E')}${pill(loft!=null?loft.toFixed(1):null,'#3D1A1A','#F27A7A','FT')}</div>`;
  }).join('');
  const legend = `<div style="display:flex;flex-wrap:wrap;gap:14px;font-size:11px;color:#8592A6;margin-top:8px">
    <span>Line: board 39 (left) → 1 (right)</span>
    <span><span style="display:inline-block;width:2px;height:10px;background:#F3F6FA;vertical-align:middle"></span> breakpoint</span>
    <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#FFD84A;vertical-align:middle"></span> entry</span>
    <span><span style="display:inline-block;width:0;height:10px;border-left:2px dashed #9AA8BC;vertical-align:middle"></span> target breakpoint</span>
    <span>Rev rate and Power are estimates</span></div>`;
  const sub = `<div style="font-size:13px;color:var(--muted);margin:-4px 0 10px">Every shot this session — tap a row to open it.</div>`;
  return head + sub + avgPills + `<div style="overflow-x:auto"><div style="min-width:640px">${colhead}
    <div style="max-height:min(60vh,620px);overflow-y:auto;display:flex;flex-direction:column;gap:4px">${rows || '<div class="ph">No shots match this filter.</div>'}</div></div></div>${legend}`;
}
const badgeFor = s => s==='guaranteed'?['✓','ok']:s==='best_effort'?['est','est']:s==='ruby'?['Ruby','ruby']:['n/a','na'];
const metricByKey = (c,k) => (c.metrics||[]).find(m=>m.key===k);
const okF = t => ({color:'#22C55E', icon:'✓', text:t}), warnF = t => ({color:'#F2C94C', icon:'!', text:t}), neutF = t => ({color:'#8592A6', icon:'·', text:t});
// perspective projection (board, z ft) -> (x,y) in the 400x310 clip, matching the mock
function persp(b, z) { const k=3, u=z/60, t=(1-1/(1+k*u))/(1-1/(1+k)), y=310-272*t, hw=160*(1-t)+28*t; return [200+(20-b)/19.5*hw, y]; }
// vivid oil ramp: light sky (light oil) -> deep blue (heavy oil)
function blueRamp(t){ const s=[[198,230,255],[120,195,255],[40,150,255],[20,96,220],[12,56,150],[6,30,92]]; t=Math.max(0,Math.min(1,t)); const x=t*(s.length-1),i=Math.floor(x),f=x-i,a=s[i],b=s[Math.min(i+1,s.length-1)],ch=k=>Math.round(a[k]+(b[k]-a[k])*f); return `rgb(${ch(0)},${ch(1)},${ch(2)})`; }
// opacity curve: lifts light oil so the light->heavy gradient reads strongly; dry (v~0) stays wood
function oilAlpha(v){ return Math.min(0.96, Math.pow(v, 0.5) * 0.98); }
const PINB={1:17.5,2:22.5,3:12.5,4:27.5,5:17.5,6:7.5,7:32.5,8:22.5,9:12.5,10:2.5}, PINR={1:0,2:1,3:1,4:2,5:2,6:2,7:3,8:3,9:3,10:3};

function renderLatest(c) {
  const i = c ? S.cards.findIndex(x=>x.id===c.id) : -1;
  const right = c ? `<button class="pill" data-nav="-1" type="button" aria-label="Previous shot" style="width:34px;height:34px;padding:0" ${i<=0?'disabled':''}>‹</button>
      <span style="font-size:13px">Shot ${c.n} of ${S.cards.length}</span>
      <button class="pill" data-nav="1" type="button" aria-label="Next shot" style="width:34px;height:34px;padding:0" ${i>=S.cards.length-1?'disabled':''}>›</button>` : '';
  const head = panelHead('Latest Shot Analysis', right);
  if (!c) return head + `<div class="ph">Waiting for the first clip.</div>`;
  if (c.status === 'queued' || c.status === 'processing') return head + `<div class="ph" style="flex-direction:column"><div class="spinbig"></div>${c.status==='queued'?'Queued':'Analyzing…'}${procStep(c)?' · '+esc(procStep(c)):''}<div class="small dim" style="margin-top:4px">${esc(c.original_name||'')}</div></div>`;
  if (c.status === 'failed') return head + `<div class="ph" style="flex-direction:column"><div class="err" style="font-size:16px;font-weight:600">Not analyzed</div><div class="err small" style="max-width:360px;text-align:center">${esc(c.error)}</div><button class="pill" id="retryBtn" type="button" style="height:30px;margin-top:8px">Retry</button></div>`;
  const tabs = ['overview','top-down','rotation','compare'].map(t =>
    `<button class="tab ${shotTab===t?'on':''}" data-stab="${t}" type="button">${t==='top-down'?'Top-down':cap(t)}</button>`).join('');
  const oil=(S.session||{}).oil, hasTarget=!!(S.session||{}).intent;
  const cb=(k,lab,on,dis)=>`<label style="display:inline-flex;gap:5px;align-items:center;font-size:12px;color:${dis?'#5B687E':'#C9D3E2'};${dis?'':'cursor:pointer'}"><input type="checkbox" data-tog="${k}" ${on?'checked':''} ${dis?'disabled':''} style="accent-color:#1677FF;width:14px;height:14px">${lab}</label>`;
  const toggles = shotTab==='overview' ? `<div style="display:flex;flex-wrap:wrap;gap:8px 16px;padding:2px 2px 0">
      ${cb('oil','Oil pattern',showOil,!oil)}${cb('target','Target line',showTarget,!hasTarget)}${cb('boards','Boards',showBoards)}${cb('arrows','Arrows',showArrows)}
    </div>` : '';
  return head + `<div style="font-size:13px;color:var(--muted);margin:-4px 0 10px">Your most recent shot — metrics, line and the next move.</div>
    <div style="display:flex;flex-wrap:wrap;gap:14px;align-items:stretch">
    <div style="flex:1 1 320px;display:flex;flex-direction:column;gap:10px;min-width:0">
      <div class="tabs" role="tablist" aria-label="Shot view">${tabs}</div>
      ${toggles}
      <div style="flex:1;min-height:340px;position:relative;border-radius:10px;overflow:hidden;background:#05080F">${renderShotView(c)}</div>
      <div style="display:flex;gap:22px;font-size:12px;color:#C9D3E2;justify-content:center;flex-wrap:wrap">
        <span><span style="display:inline-block;width:26px;height:3px;background:#2E9BFF;vertical-align:middle;border-radius:2px"></span> Actual Path</span>
        <span><span style="display:inline-block;width:26px;border-top:2px dashed #F3F6FA;vertical-align:middle"></span> Your Target Line</span></div>
    </div>
    <div style="flex:1 1 250px;display:flex;flex-direction:column;gap:10px;min-width:0">
      ${renderMetricsGrid(c)}${renderAnalysis(c)}</div>
  </div>`;
}

function renderShotView(c) {
  if (shotTab === 'rotation') return renderRotation(c);
  if (shotTab === 'compare') return `<div class="ph" style="height:100%">Shot compare — coming soon.</div>`;
  if (shotTab === 'top-down') return renderTopDown(c);
  return renderOverviewClip(c);
}

function renderOverviewClip(c) {
  const oil=(S.session||{}).oil, kp=c.key_points||{}, path=c.path||[];
  let oilSvg='';
  if (oil && oil.grid) { const zs=oil.z_ft, dz=zs.length>1?zs[1]-zs[0]:2;
    for(let i=0;i<oil.grid.length;i++){ const z0=zs[i], z1=Math.min(z0+dz,60);
      for(let b=1;b<=39;b++){ const v=oil.grid[i][b-1]; if(v<0.03) continue;
        const p1=persp(b-0.5,z0),p2=persp(b+0.5,z0),p3=persp(b+0.5,z1),p4=persp(b-0.5,z1);
        oilSvg+=`<polygon points="${p1[0].toFixed(1)},${p1[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)} ${p3[0].toFixed(1)},${p3[1].toFixed(1)} ${p4[0].toFixed(1)},${p4[1].toFixed(1)}" fill="${blueRamp(v)}" opacity="${oilAlpha(v).toFixed(2)}"></polygon>`;
      } } }
  const pp = p => { const [x,y]=persp(p[1],p[0]); return x.toFixed(1)+','+y.toFixed(1); };
  const pathPts = path.map(pp).join(' ');
  const it=(S.session||{}).intent||{}; let targetPts='';
  if (it.laydown_board!=null && it.arrows_board!=null && it.breakpoint_board!=null) {
    const bpz=(kp.breakpoint||{}).z_ft||38, en=(kp.entry||{}).board??it.breakpoint_board;
    targetPts=[[it.laydown_board,0],[it.arrows_board,15],[it.breakpoint_board,bpz],[en,59.4]].map(([b,z])=>{const[x,y]=persp(b,z);return x.toFixed(1)+','+y.toFixed(1);}).join(' ');
  }
  let callouts='', marksD='';
  const mark=(b,z)=>{const[x,y]=persp(b,z); marksD+=`M${(x-5).toFixed(1)},${y.toFixed(1)}a5,5 0 1,0 10,0a5,5 0 1,0 -10,0`; return [x,y];};
  if (kp.breakpoint&&kp.breakpoint.board!=null){ const[x,y]=mark(kp.breakpoint.board,kp.breakpoint.z_ft); callouts+=calloutSvg('Break Point',kp.breakpoint.board.toFixed(1),x+12,y+10); }
  if (kp.entry&&kp.entry.board!=null){ const[x,y]=mark(kp.entry.board,kp.entry.z_ft); callouts+=calloutSvg('Entry Board',kp.entry.board.toFixed(1),x+12,y-30); }
  const standing=new Set((c.pins||{}).standing||[]); let pinsUp='',pinsDown='';
  if (c.pins) Object.keys(PINB).forEach(n=>{ const[x,y]=persp(PINB[n],60+PINR[n]*0.866); const d=`M${(x-4).toFixed(1)},${(y-5).toFixed(1)}a4,4 0 1,0 8,0a4,4 0 1,0 -8,0`; if(standing.has(+n)) pinsUp+=d; else pinsDown+=d; });
  let boardsSvg='';
  if (showBoards) for(let b=5;b<=35;b+=5){ const[x0,y0]=persp(b,0),[x1,y1]=persp(b,59.4); boardsSvg+=`<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke="#000" stroke-opacity=".16" stroke-width="1"></line>`; }
  let arrowsSvg='';
  if (showArrows) for(const b of [5,10,15,20,25,30,35]){ const[x,y]=persp(b,15); arrowsSvg+=`<path d="M${x.toFixed(1)},${(y-4).toFixed(1)} l3.2,6 l-6.4,0 Z" fill="#2A3340"></path>`; }
  return `<svg viewBox="0 0 400 310" preserveAspectRatio="xMidYMid meet" width="100%" height="100%" role="img" aria-label="Simulated lane with your line, target line and oil pattern" style="display:block">
      <defs><linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5C3A1C"></stop><stop offset=".5" stop-color="#A86E37"></stop><stop offset="1" stop-color="#C98B4C"></stop></linearGradient></defs>
      <rect width="400" height="310" fill="#0A0E15"></rect>
      <polygon points="40,310 360,310 228,28 172,28" fill="url(#wood)"></polygon>
      ${showOil?oilSvg:''}${boardsSvg}${arrowsSvg}
      <polygon points="18,310 40,310 172,28 166,28" fill="#2B313B"></polygon><polygon points="360,310 382,310 234,28 228,28" fill="#2B313B"></polygon>
      <path d="${pinsDown}" fill="#F3F1EC" fill-opacity=".18"></path><path d="${pinsUp}" fill="#F3F1EC"></path>
      ${showTarget&&targetPts?`<polyline points="${targetPts}" fill="none" stroke="#F3F6FA" stroke-width="2.5" stroke-dasharray="8 7"></polyline>`:''}
      ${pathPts?`<polyline points="${pathPts}" fill="none" stroke="#2E9BFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity=".95"></polyline><polyline points="${pathPts}" fill="none" stroke="#7CE3FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></polyline>`:''}
      <path d="${marksD}" fill="#F3F6FA" stroke="#05080F" stroke-width="2"></path>${callouts}
    </svg>
    ${showOil&&oil?`<div style="position:absolute;left:8px;bottom:8px;background:#05080Fdd;padding:4px 7px;border-radius:6px;display:flex;flex-direction:column;gap:3px">
      <div style="display:flex;align-items:center;gap:6px;font-size:10px;color:#C9D3E2">Light<span style="width:64px;height:8px;border-radius:3px;background:linear-gradient(90deg,${blueRamp(.05)},${blueRamp(.4)},${blueRamp(.72)},${blueRamp(1)})"></span>Heavy oil</div>
      <div style="font-size:9px;color:#8FB6E0">${esc(oil.name)} · modeled, not a scan</div></div>`:''}`;
}
function calloutSvg(label,value,x,y){ const w=62,h=26; x=Math.max(2,Math.min(400-w-2,x)); y=Math.max(2,Math.min(310-h-2,y));
  return `<g><rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w}" height="${h}" rx="5" fill="#0A0F18" fill-opacity=".92" stroke="#fff" stroke-opacity=".14"></rect>
    <text x="${(x+6).toFixed(1)}" y="${(y+10).toFixed(1)}" fill="#C9D3E2" font-size="8" font-weight="600">${label}</text>
    <text x="${(x+6).toFixed(1)}" y="${(y+21).toFixed(1)}" fill="#F3F6FA" font-size="12" font-weight="700">${value}</text></g>`; }

function renderTopDown(c) {
  const W=200,H=310,mx=20,my=10,lw=W-2*mx,lh=H-2*my,ZMAX=62; const oil=(S.session||{}).oil, path=c.path||[], kp=c.key_points||{};
  const bx=b=>mx+(39-b)/38*lw, zy=z=>(H-my)-z/ZMAX*lh;
  let oilSvg='';
  if (oil&&oil.grid){ const cw=lw/39, zs=oil.z_ft, dz=zs.length>1?zs[1]-zs[0]:2;
    for(let i=0;i<oil.grid.length;i++){ const z0=zs[i],z1=i+1<zs.length?zs[i+1]:z0+dz,y=zy(z1),hh=Math.max(zy(z0)-zy(z1),0.6);
      for(let b=0;b<39;b++){ const v=oil.grid[i][b]; if(v<0.03)continue; oilSvg+=`<rect x="${(bx(b+1)-cw/2).toFixed(1)}" y="${y.toFixed(1)}" width="${(cw+0.5).toFixed(1)}" height="${hh.toFixed(1)}" fill="${blueRamp(v)}" opacity="${oilAlpha(v).toFixed(2)}"></rect>`; } } }
  const pathPts=path.map(p=>`${bx(p[1]).toFixed(1)},${zy(p[0]).toFixed(1)}`).join(' ');
  const kpd=[['laydown',kp.laydown],['arrows',kp.arrows],['breakpoint',kp.breakpoint],['entry',kp.entry]].filter(([,k])=>k&&k.board!=null)
    .map(([,k])=>`<circle cx="${bx(k.board).toFixed(1)}" cy="${zy(k.z_ft).toFixed(1)}" r="2.6" fill="#fff" stroke="#05080F"></circle>`).join('');
  const standing=new Set((c.pins||{}).standing||[]);
  const pins=c.pins?Object.keys(PINB).map(n=>`<circle cx="${bx(PINB[n]).toFixed(1)}" cy="${zy(60+PINR[n]*0.866).toFixed(1)}" r="3" fill="${standing.has(+n)?'#F3F1EC':'#2A3A52'}" stroke="#05080F"></circle>`).join(''):'';
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" width="100%" height="100%" style="display:block" role="img" aria-label="Top-down lane with oil and your line">
      <rect x="${mx}" y="${my}" width="${lw}" height="${lh}" fill="#6B4A26"></rect>
      <rect x="${mx-6}" y="${my}" width="6" height="${lh}" fill="#2A3240"></rect><rect x="${mx+lw}" y="${my}" width="6" height="${lh}" fill="#2A3240"></rect>
      ${oilSvg}${oil?`<line x1="${mx}" x2="${mx+lw}" y1="${zy(oil.length_ft).toFixed(1)}" y2="${zy(oil.length_ft).toFixed(1)}" stroke="#3FB6FF" stroke-dasharray="3 3" opacity=".6"></line>`:''}
      ${pathPts?`<polyline points="${pathPts}" fill="none" stroke="#2E9BFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></polyline>`:''}
      ${kpd}${pins}
      <text x="${W/2}" y="8" fill="#9AA8BC" font-size="8" text-anchor="middle">pins</text><text x="${W/2}" y="${H-1}" fill="#9AA8BC" font-size="8" text-anchor="middle">foul</text></svg>
    ${oil?`<div style="position:absolute;left:8px;bottom:8px;background:#05080Fdd;padding:4px 7px;border-radius:6px;display:flex;flex-direction:column;gap:3px">
      <div style="display:flex;align-items:center;gap:6px;font-size:10px;color:#C9D3E2">Light<span style="width:64px;height:8px;border-radius:3px;background:linear-gradient(90deg,${blueRamp(.05)},${blueRamp(.4)},${blueRamp(.72)},${blueRamp(1)})"></span>Heavy oil</div>
      <div style="font-size:9px;color:#8FB6E0">${esc(oil.name)} · modeled, not a scan</div></div>`:''}`;
}

function renderRotation(c) {
  const s=c.sensor||{};
  const rows=[['Axis tilt','axis_tilt_deg','°'],['Axis rotation','axis_rotation_deg','°'],['PAP','pap','in']];
  const body=rows.map(([lab,k,u])=>{ const v=s[k]; return `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1E2C45">
    <span style="color:#C9D3E2">${lab}</span><span class="num" style="font-weight:600">${v!=null&&v!==''?v+' '+u+' <span class=\"b ruby\" style=\"margin-left:4px\">Ruby</span>':'<span class=\"muted\">—</span>'}</span></div>`;}).join('');
  return `<div class="sub" style="padding:14px;height:100%;display:flex;flex-direction:column">
    <h3 style="font-size:14px;font-weight:600;margin-bottom:6px">Rotation &amp; axis</h3>${body}
    <div class="muted" style="font-size:11px;margin-top:10px">Axis tilt, rotation and PAP aren't measurable from 60 fps video — enter the Ruby values (Ruby button below) to show them here.</div></div>`;
}

function renderMetricsGrid(c) {
  // key -> averages key for the "vs session avg" delta (only where an average exists; no filler otherwise)
  const AVG={ball_speed:'ball_speed',rev_rate:'rev_rate',entry_angle:'entry_angle',breakpoint_board:'breakpoint_board',entry_board:'entry_board'};
  const defs=[['Speed','ball_speed','MPH',1],['Rev Rate','rev_rate','RPM',0],['Launch Angle','launch_angle','°',1],['Entry Angle','entry_angle','°',1],['Break Point','breakpoint_board','Boards',1],['Entry Board','entry_board','Boards',1],['Pocket Speed','speed_late','MPH',1],['Power','power','/100',0]];
  const avgs=(S.stats||{}).averages||{};
  const cells=defs.map(([label,key,unit,dec])=>{
    let val,status,why;
    if(key==='power'){ const p=c.power||{}; val=p.value; status='best_effort'; why=p.why||'Impact energy at pocket speed. Not a carry score.'; }
    else { const m=metricByKey(c,key); val=m?m.value:null; status=m?m.status:'unavailable'; why=m?m.why:''; }
    const [b,bc]=badgeFor(status), disp=val==null?'—':(dec?val.toFixed(dec):Math.round(val));
    // delta vs session average (good=green when toward the better direction isn't known, so stay neutral on color: up/down arrow only)
    let delta='';
    const ak=AVG[key], st=avgs[ak];
    if(val!=null && st && st.n>1){ const d=val-st.mean; if(Math.abs(d)>=(dec?0.05:0.5)){ const up=d>0; delta=`<div style="font-size:10px;color:#8592A6;margin-top:1px">${up?'↑':'↓'} ${Math.abs(d).toFixed(dec||0)} vs avg</div>`; } }
    return `<div title="${esc(why)}" style="background:#0B1322;border:1px solid #1E2C45;border-radius:7px;padding:6px 8px">
      <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:11px;color:#C9D3E2">${label}</span><span class="b ${bc}">${b}</span></div>
      <div class="num" style="font-size:19px;font-weight:600">${disp}<span style="font-size:11px;color:#9AA8BC;font-weight:500"> ${val==null?'':esc(unit)}</span></div>${delta}</div>`;
  }).join('');
  return `<div class="sub" style="padding:10px"><h3 style="font-size:14px;font-weight:600;margin-bottom:8px">Shot Metrics</h3>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px">${cells}</div></div>`;
}

function buildVerdict(c){
  const ins=c.insights||{}, pins=c.pins, hit=ins.hit||{}, recs=ins.recommendations||[];
  const next=recs.length?recs[0].reason:(ins.classification==='LOW_CONFIDENCE'?'Not enough evidence for an adjustment yet.':'');
  if(c.kind==='spare') return pins&&pins.strike?{good:true,title:'Spare made',body:'Cleared the leave.',next}:{good:false,title:'Open',body:'Missed the spare.',next};
  if(pins&&pins.strike&&hit.hit==='pocket') return {good:true,title:'Great shot',body:'Pocket hit at a good entry angle. Strike.',next};
  if(pins&&pins.strike) return {good:true,title:'Strike',body:hit.reason||'',next};
  const leave=pins?(pins.standing||[]).join('-'):'';
  return {good:false,title:leave?'Leave '+leave:(pins?'Pins not read':'No strike'),body:hit.reason||(ins.leave||{}).reason||'',next};
}
function missText(ex){ return Object.entries(ex.misses||{}).map(([k,v])=>`${k.replace('_board','')} ${v>0?'+':''}${v}`).join(', '); }
function keyFactors(c){
  const ins=c.insights||{}, hit=ins.hit||{}, out=[];
  const entry=metricVal(c,'entry_board'), ang=metricVal(c,'entry_angle'), bp=metricVal(c,'breakpoint_board');
  const tgt=((c.intent||{}).breakpoint_board)??((S.session.intent||{}).breakpoint_board);
  if(entry!=null) out.push(hit.hit==='pocket'?okF(`Entry board in the pocket (${entry.toFixed(1)})`):warnF(`Entry board ${entry.toFixed(1)}: ${hit.hit||(entry>18?'high':'light')}`));
  if(ang!=null) out.push(ang>=4&&ang<=7?okF(`Good entry angle (${ang.toFixed(1)}°)`):warnF(`Entry angle ${ang.toFixed(1)}°`));
  if(bp!=null) out.push(tgt!=null?(Math.abs(bp-tgt)<=1.5?okF(`Breakpoint on target (${bp.toFixed(1)} vs ${tgt})`):warnF(`Breakpoint ${bp.toFixed(1)} vs target ${tgt}`)):neutF(`Breakpoint ${bp.toFixed(1)} (no target set)`));
  const ex=ins.execution, hm=c.hit_mark;
  if(hm==='yes') out.push(okF(ex&&ex.misses?`Hit your mark (${missText(ex)})`:'You hit your mark'));
  else if(hm==='no') out.push(warnF('Missed your mark'));
  else if(hm==='unsure') out.push(neutF('Not sure you hit your mark'));
  else out.push(neutF('Did you hit your mark? (Y / N)'));
  return out;
}
function renderAnalysis(c){
  const v=buildVerdict(c), factors=keyFactors(c), vcol=v.good?'#22C55E':'#F2C94C';
  const vicon=v.good?`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#06101E" stroke-width="3.5"><path d="M5 12l5 5 9-10"></path></svg>`:`<span style="color:#06101E;font-weight:900;font-size:13px">!</span>`;
  const well=factors.filter(f=>f.color==='#22C55E'), miss=factors.filter(f=>f.color!=='#22C55E');
  const flist=(arr)=>arr.map(f=>`<div style="display:flex;gap:8px;align-items:center;font-size:12px;color:#C9D3E2"><span style="flex:0 0 14px;height:14px;border-radius:50%;background:${f.color};display:grid;place-items:center;color:#06101E;font-size:9px;font-weight:900">${f.icon}</span>${esc(f.text)}</div>`).join('');
  const rec=(c.insights||{}).recommendations||[]; const conf=rec.length?rec[0].confidence:null;
  const confBadge=conf?`<span class="b ${conf==='high'?'ok':conf==='low'?'na':'est'}" style="margin-left:auto">Confidence: ${esc(conf)}</span>`:'';
  return `<div class="sub" style="padding:12px;display:flex;flex-direction:column;gap:8px">
    <div style="display:flex;align-items:center;gap:8px"><h3 style="font-size:14px;font-weight:600">Analysis &amp; Recommendation</h3>${confBadge}</div>
    <div style="display:flex;gap:10px;align-items:flex-start">
      <span style="flex:0 0 26px;height:26px;border-radius:50%;background:${vcol};display:grid;place-items:center">${vicon}</span>
      <div><div style="font-size:16px;font-weight:700;color:${v.good?'#43D893':'#F2C94C'}">${esc(v.title)}</div><div style="font-size:12px;color:#C9D3E2">${esc(v.body)}</div></div></div>
    ${well.length?`<div style="font-size:12px;font-weight:600;color:#43D893">What went well</div>${flist(well)}`:''}
    ${miss.length?`<div style="font-size:12px;font-weight:600;color:#F2C94C">What to watch</div>${flist(miss)}`:''}
    ${v.next?`<div style="font-size:12px;color:#9DC6FF;border-top:1px solid #1E2C45;padding-top:7px"><span style="color:#9AA8BC;font-weight:600">Next move: </span>${esc(v.next)}</div>`:''}
    ${renderSpare(c)}
    <div style="display:flex;flex-wrap:wrap;gap:5px;align-items:center;border-top:1px solid #1E2C45;padding-top:7px">
      <span style="font-size:11px;color:#9AA8BC">Hit mark?</span>
      <button class="pill ${c.hit_mark==='yes'?'on':''}" data-hm="yes" type="button" style="height:26px">Yes</button>
      <button class="pill ${c.hit_mark==='no'?'on':''}" data-hm="no" type="button" style="height:26px">No</button>
      <button class="pill ${inputMode==='pins'?'on':''}" data-imode="pins" type="button" style="height:26px">Fix pins</button>
      <button class="pill ${inputMode==='ruby'?'on':''}" data-imode="ruby" type="button" style="height:26px">Ruby</button>
      <button class="pill ${c.rec_vote==='up'?'on':''}" data-vote="up" type="button" style="height:26px">Advice right</button>
      <button class="pill ${c.rec_vote==='down'?'on':''}" data-vote="down" type="button" style="height:26px">Advice wrong</button></div>
    ${inputMode==='pins'?pinEditor(c):''}${inputMode==='ruby'?rubyEditor(c):''}</div>`;
}
function renderSpare(c){ if(c.kind!=='first'||!c.spare_plan) return ''; const sl=c.spare_plan.straight_line;
  return `<div style="font-size:12px;color:#5FD8CB">Spare ${esc(c.spare_plan.leave)}: lay down ${sl.laydown_board}, arrows ${sl.arrows_board}, aim ${sl.pin_board} · ${esc(c.spare_plan.ball)}</div>`; }
function pinEditor(c){ const pins=new Set((c.pins||{}).standing||[]), unc=new Set((c.pins||{}).uncertain||[]);
  return `<div style="border-top:1px solid #1E2C45;padding-top:8px;display:flex;flex-direction:column;align-items:center;gap:6px">
    ${PIN_ROWS.map(row=>`<div style="display:flex;gap:6px">${row.map(n=>`<button class="pill ${pins.has(n)?'on':''}" data-pin="${n}" type="button" style="width:34px;height:34px;padding:0;border-radius:50%${unc.has(n)?';border-color:#F2C94C;color:#F2C94C':''}">${n}</button>`).join('')}</div>`).join('')}
    ${c.pins_override?`<button class="pill" id="pinReset" type="button" style="height:26px">Use video read</button>`:''}</div>`;
}
function rubyEditor(c){ const s=c.sensor||{};
  return `<div style="border-top:1px solid #1E2C45;padding-top:8px;display:flex;flex-direction:column;gap:6px">
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">${SENSOR_FIELDS.map(([k,l,st])=>`<label class="lbl">${l}<input class="fld" data-s="${k}" type="number" step="${st}" value="${s[k]??''}"></label>`).join('')}</div>
    <button class="pill on" id="saveRuby" type="button" style="height:28px">Save Ruby</button>${renderVariance(c.sensor_variance)}</div>`;
}
function renderVariance(v){ if(!v||!Object.keys(v.compared||{}).length) return ''; const lab={ball_speed:'Speed',rev_rate:'Rev',loft:'Loft'};
  return `<div style="font-size:12px;color:#C9D3E2">${Object.entries(v.compared).map(([k,x])=>`<div style="display:flex;justify-content:space-between"><span class="muted">${lab[k]||k} vs Ruby</span><span class="num">${x.diff>0?'+':''}${x.diff}${x.pct!=null?` (${x.pct>0?'+':''}${x.pct}%)`:''}</span></div>`).join('')}</div>`; }

/* ---------- start session ---------- */
function renderStart() {
  $('#hstatus').innerHTML = '';
  if (patternsLib === null) { patternsLib = []; api('/api/patterns').then(p => { patternsLib = p; if (!S.session) renderStart(); }).catch(() => {}); }
  const prev = S.sessions[0] || {};
  const patOpts = (patternsLib || []).map(p => `<option value="${esc(p.name)}" data-len="${p.length_ft}">${esc(p.name)} · ${p.length_ft} ft</option>`).join('');
  $('#app').innerHTML = `<div class="card" style="max-width:620px;margin:30px auto;padding:20px">
    <h2 style="font-size:18px;font-weight:600;margin-bottom:14px">Start a session</h2>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
      <label class="lbl">Type<select class="fld" id="s_kind"><option>practice</option><option>league</option><option>tournament</option></select></label>
      <label class="lbl">Hand<select class="fld" id="s_hand"><option value="">Auto from video</option><option value="R">Right</option><option value="L">Left</option></select></label>
      <label class="lbl">Center<input class="fld" id="s_center" placeholder="e.g. Richmond Bowling Center"></label>
      <label class="lbl">Lane #<input class="fld" id="s_lane" type="number" step="1" placeholder="optional"></label>
      <label class="lbl">Ball<input class="fld" id="s_ball" placeholder="e.g. Phaze II" value="${esc(prev.ball_name || '')}"></label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label class="lbl">Weight lb<input class="fld" id="s_wt" type="number" step="0.5" placeholder="15"></label>
        <label class="lbl">RG in<input class="fld" id="s_rg" type="number" step="0.01" placeholder="2.50"></label></div>
      <label class="lbl">Oil pattern<select class="fld" id="s_pat"><option value="">Custom / none</option>${patOpts}</select></label>
      <label class="lbl">Pattern length ft<input class="fld" id="s_len" type="number" step="1" placeholder="auto from pattern"></label>
    </div>
    <p class="lbl" style="margin:-2px 0 8px">Pick a known pattern to see its oil heatmap under your line (modeled from the pattern's published spec, not a lane scan).</p>
    <p class="small muted" style="margin:0 0 12px">Record each shot on the iPhone (1080p, 60 fps, tripod, HDR off) and AirDrop it to this Mac. Clips in
      <span class="kbd">${esc(S.watch_dir || '')}</span> are picked up automatically, or drag a clip onto this page.</p>
    <button class="pill on" id="startBtn" type="button" style="height:40px;padding:0 18px;font-size:14px">Start session</button>
    ${S.sessions.length ? `<div style="margin-top:16px;border-top:1px solid var(--cardline);padding-top:12px"><h3 style="font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px">Past sessions</h3>${S.sessions.map(s =>
      `<div style="display:flex;justify-content:space-between;gap:8px;padding:4px 0;font-size:13px"><span>#${s.id} ${esc(s.kind)} · ${new Date(s.started_at).toLocaleString()} · ${esc(s.ball_name || '')}</span>
       <span>${s.shot_count} shots · <a href="/api/sessions/${s.id}/export.csv">CSV</a></span></div>`).join('')}</div>` : ''}
  </div>`;
  $('#s_pat').onchange = () => { const o = $('#s_pat').selectedOptions[0]; if (o && o.dataset.len) $('#s_len').value = o.dataset.len; };
  $('#startBtn').onclick = async () => {
    const num = id => { const v = $(id).value; return v === '' ? null : parseFloat(v); };
    await api('/api/session', {method:'POST', body:{kind:$('#s_kind').value, handed:$('#s_hand').value || null,
      ball_name:$('#s_ball').value || null, ball_weight_lb:num('#s_wt'), ball_rg_in:num('#s_rg'),
      pattern_name:$('#s_pat').value || null, pattern_length_ft:num('#s_len'),
      center:$('#s_center').value || null, lane:num('#s_lane')}});
    follow = true; load();
  };
}

/* ---------- bind ---------- */
function bind(sess, c) {
  const en = $('#editName'); if (en) en.onclick = () => { const v = prompt('Session name', sess.name || ''); if (v != null) api('/api/session', {method:'PATCH', body:{name: v || null}}).then(load); };
  const es = $('#editSess'); if (es) es.onclick = () => editSession(sess);
  const eb = $('#endBtn'); if (eb) eb.onclick = () => { if (confirm('End this session?')) api('/api/session/end', {method:'POST'}).then(load); };
  document.querySelectorAll('[data-view]').forEach(t => t.onclick = () => setView(t.dataset.view));
  document.querySelectorAll('input,select,textarea').forEach(i => { i.onfocus = () => editing = true; i.onblur = () => editing = false; });
  bindShots(sess, c); bindLatest(sess, c); bindOverview(); bindTransition();
}
function bindShots() {
  document.querySelectorAll('[data-filter]').forEach(b => b.onclick = () => { shotFilter = b.dataset.filter; render(); });
  document.querySelectorAll('[data-shot]').forEach(el => el.onclick = () => { selected = +el.dataset.shot; follow = selected === S.cards[S.cards.length-1].id; view = 'latest'; render(); });
}
function bindLatest(sess, c) {
  document.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => navShot(+b.dataset.nav));
  document.querySelectorAll('[data-stab]').forEach(b => b.onclick = () => { shotTab = b.dataset.stab; render(); });
  document.querySelectorAll('[data-tog]').forEach(b => b.onchange = () => { const k = b.dataset.tog;
    if (k==='oil') showOil=b.checked; else if (k==='target') showTarget=b.checked; else if (k==='boards') showBoards=b.checked; else if (k==='arrows') showArrows=b.checked; render(); });
  document.querySelectorAll('[data-imode]').forEach(b => b.onclick = () => { inputMode = inputMode === b.dataset.imode ? null : b.dataset.imode; render(); });
  if (!c || c.status !== 'done') { const rb = $('#retryBtn'); if (rb) rb.onclick = () => api(`/api/shots/${c.id}/retry`, {method:'POST'}); return; }
  const post = body => api(`/api/shots/${c.id}`, {method:'POST', body}).then(load);
  document.querySelectorAll('[data-hm]').forEach(b => b.onclick = () => post({hit_mark: c.hit_mark === b.dataset.hm ? null : b.dataset.hm}));
  document.querySelectorAll('[data-vote]').forEach(b => b.onclick = () => post({rec_vote: c.rec_vote === b.dataset.vote ? null : b.dataset.vote}));
  document.querySelectorAll('[data-pin]').forEach(b => b.onclick = () => { const s = new Set(c.pins ? c.pins.standing : []); const n = +b.dataset.pin; s.has(n) ? s.delete(n) : s.add(n); post({pins_override:[...s]}); });
  const pr = $('#pinReset'); if (pr) pr.onclick = () => post({clear_pins_override:true});
  const sr = $('#saveRuby'); if (sr) sr.onclick = () => { const o = {}; document.querySelectorAll('[data-s]').forEach(i => o[i.dataset.s] = i.value === '' ? null : parseFloat(i.value)); post({sensor:o}); };
}
function bindOverview() {
  document.querySelectorAll('[data-range]').forEach(b => b.onclick = () => { range = b.dataset.range; render(); });
  const cs = $('#ckSpeed'); if (cs) cs.onchange = () => { showSpeed = cs.checked; render(); };
  const cr = $('#ckRev'); if (cr) cr.onchange = () => { showRev = cr.checked; render(); };
}
function bindTransition() {
  document.querySelectorAll('[data-ttab]').forEach(b => b.onclick = () => { transTab = b.dataset.ttab; render(); });
}
function editSession(sess) {
  const name = prompt('Current ball name', sess.ball_name || ''); if (name == null) return;
  const pat = prompt('Oil pattern name (blank to keep)', sess.pattern_name || '');
  const body = {ball_name: name || null};
  if (pat != null) body.pattern_name = pat || null;
  api('/api/session', {method:'PATCH', body}).then(load);
}

document.addEventListener('keydown', e => {
  if (!S || !S.session || ['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  const c = current(); const k = e.key.toLowerCase();
  if (c && c.status === 'done' && {y:'yes', n:'no', u:'unsure'}[k]) api(`/api/shots/${c.id}`, {method:'POST', body:{hit_mark:{y:'yes', n:'no', u:'unsure'}[k]}}).then(load);
  else if (k === 'arrowleft') navShot(-1);
  else if (k === 'arrowright') navShot(1);
});
function navShot(d) {
  if (!S || !S.cards.length) return;
  const i = S.cards.findIndex(x => x.id === selected);
  const j = Math.max(0, Math.min(S.cards.length-1, (i < 0 ? S.cards.length-1 : i) + d));
  selected = S.cards[j].id; follow = j === S.cards.length-1; render();
}
$('#speechBtn').onclick = () => api(`/api/speech?on=${!S.speech}`, {method:'POST'}).then(load);

let dragDepth = 0;
addEventListener('dragenter', e => { e.preventDefault(); if (S && S.session) { dragDepth++; $('#drop').style.display = 'flex'; } });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('#drop').style.display = 'none'; } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', async e => {
  e.preventDefault(); dragDepth = 0; $('#drop').style.display = 'none';
  if (!S || !S.session) return;
  for (const f of e.dataTransfer.files) { const fd = new FormData(); fd.append('file', f);
    await fetch('/api/upload', {method:'POST', body:fd}).then(async r => { if (!r.ok) alert((await r.json()).detail); }); }
  follow = true; load();
});

load().then(connect);
</script>
</body>
</html>
