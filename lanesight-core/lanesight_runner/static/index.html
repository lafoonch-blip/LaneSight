<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LaneSight runner</title>
<style>
/* v2 design (runner_v2_mock). System fonts so it works offline at the lanes. */
:root{
  --bg:#0A111D; --panel:#111B2B; --tile:#0D1625; --line:#1F2E45; --tileline:#1C2A40; --fieldbg:#0B1422; --fieldline:#23344E;
  --ice:#E8EEF6; --muted:#93A3BA; --dim:#7F8DA3; --dimmer:#5D6B82;
  --cyan:#00C2EE; --cyan2:#3FD8FF; --blue:#0E6BE0; --good:#4BE0A0; --warn:#F5CF5B; --orange:#F5A524; --bad:#ff6b6b;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ice);font:15px/1.4 var(--sans)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
a{color:var(--cyan2);text-decoration:none}a:hover{color:#9BEBFF;text-decoration:underline}
h2.h{margin:0 0 12px;font:600 12px/1 var(--sans);letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.lbl{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}.dim{color:var(--dim)}.small{font-size:12px}.err{color:var(--bad)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-sizing:border-box;min-width:0}
.badge{font:700 10px/1 var(--sans);letter-spacing:.6px;border-radius:4px;padding:3px 5px;text-transform:uppercase;white-space:nowrap}
.ok{background:#123D2D;color:var(--good)}.est{background:#3D3311;color:var(--warn)}.na{background:#232B38;color:#8E9AAD}.you{background:#15263C;color:#7FB2E8}
.tab{background:none;border:1px solid #23344E;color:#C3CEDD;border-radius:8px;padding:7px 12px;font:500 13px var(--sans);cursor:pointer;min-height:34px}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
.btn{background:#162438;border:1px solid #27395A;color:var(--ice);border-radius:9px;padding:9px 14px;font:500 14px var(--sans);min-height:40px;cursor:pointer}
.btn:hover{border-color:#3a557f}
.btn.on{background:var(--cyan);border-color:var(--cyan);color:#04121F;font-weight:700}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.fld{background:var(--fieldbg);border:1px solid var(--fieldline);border-radius:8px;color:var(--ice);padding:8px 9px;font:500 15px var(--sans);width:100%;box-sizing:border-box}
.fld:focus{outline:none;border-color:var(--cyan)}
input[type=number]{font-variant-numeric:tabular-nums}
label.lbl{display:block}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:#C3CEDD;border:1px solid #23344E;border-radius:999px;padding:7px 12px}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.spin{width:12px;height:12px;border:2px solid #4A3E18;border-top-color:var(--warn);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.warnbox{background:#3a2b0e;border:1px solid #6b5418;color:#f5d98a;border-radius:8px;padding:8px 10px;font-size:13px}
.kpi{background:var(--tile);border:1px solid var(--tileline);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-size:32px;font-weight:700;line-height:1.05}
.kpi .v small{font-size:15px;color:var(--muted);font-weight:500;margin-left:3px}
.m{background:var(--tile);border:1px solid var(--tileline);border-radius:9px;padding:9px 10px;display:flex;flex-direction:column;gap:2px;min-height:74px;position:relative}
.m .v{font-size:25px;font-weight:700}
.m .v small{font-size:13px;color:var(--muted);font-weight:500;margin-left:2px}
.adj{background:#0F2742;border:1px solid #1E4A7A;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.adj .main{font:700 22px var(--sans)}
.ring{width:74px;height:74px;border-radius:50%;display:grid;place-items:center}
.ring span{width:58px;height:58px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:24px;font-weight:700}
.pinbtn{width:44px;height:44px;border-radius:50%;font:700 15px var(--sans);cursor:pointer;border:2px solid #2D4363;background:var(--fieldbg);color:var(--muted)}
.pinbtn.up{border-color:#F7F9FC;background:#F7F9FC;color:#04121F}
.pinbtn.unc{border-color:var(--warn);color:var(--warn)}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.seg{display:grid;gap:6px}
.varrow{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.rowline{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.sgrid{display:grid;gap:0 8px;align-items:center}
.srow{padding:8px 10px;border-bottom:1px solid #18253A;text-align:right;font-variant-numeric:tabular-nums;font-size:16px;cursor:pointer;border-radius:8px}
.srow:hover{background:#0F1B2E}
.srow.sel{background:#14304F}
.shead{padding:0 10px 8px;border-bottom:1px solid var(--line);font:600 11px var(--sans);letter-spacing:.8px;text-transform:uppercase;color:var(--muted);text-align:right}
.thumb{display:inline-block;width:44px;height:30px;border-radius:5px;background:linear-gradient(180deg,#1A2233 0 30%,#6B4A26 30%);vertical-align:middle}
.start{max-width:600px;margin:40px auto}
#drop{position:fixed;inset:0;background:#0E6BE0cc;display:none;align-items:center;justify-content:center;font-size:28px;font-weight:700;z-index:10}
.kbd{font:500 11px var(--mono);color:var(--muted);border:1px solid #27395A;border-radius:4px;padding:1px 4px}
.status{padding:30px;text-align:center}
.bigspin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--cyan);border-radius:50%;animation:s 1s linear infinite;margin:0 auto 12px}
.media{position:relative;background:#05090F;border-radius:12px;overflow:hidden}
.media img{width:100%;display:block}
.noreplay{min-height:420px;display:flex;align-items:center;justify-content:center;color:var(--dim);text-align:center;padding:20px}
</style>
</head>
<body>
<header style="display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;padding:14px 24px;border-bottom:1px solid #1A2840;background:#0C1524">
  <div style="display:flex;align-items:center;gap:10px">
    <svg width="34" height="22" viewBox="0 0 34 22" aria-hidden="true"><path d="M2 20 L14 2 M32 20 L20 2" stroke="#3FD8FF" stroke-width="2.4" fill="none" stroke-linecap="round"></path><path d="M17 20 C17 13 12 9 14 4" stroke="#0E6BE0" stroke-width="2.4" fill="none" stroke-linecap="round"></path></svg>
    <span style="font:700 21px var(--sans);letter-spacing:.3px">Lane<span style="color:#3FD8FF">Sight</span></span>
    <span style="font-size:12px;color:var(--muted);border:1px solid #27395A;border-radius:999px;padding:3px 9px">runner</span>
  </div>
  <div id="sessmeta" style="display:flex;flex-direction:column;gap:3px"></div>
  <div style="flex:1"></div>
  <div id="hstatus" class="rowline" style="gap:8px"></div>
  <button id="speechBtn" class="btn" type="button">🔊 Speech</button>
  <button id="endBtn" class="btn" type="button" style="display:none">End session</button>
</header>
<div id="app"></div>
<div id="drop">Drop clip to analyze</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S = null, selected = null, follow = true, editing = false, range = 'all', shotFilter = 'all', mediaTab = 'video', chartTab = 'speedrev';
const PIN_ROWS = [[7,8,9,10],[4,5,6],[2,3],[1]];
const trajCache = {};

async function api(path, opts={}) {
  const r = await fetch(path, {headers:{'Content-Type':'application/json'}, ...opts,
    body: opts.body && typeof opts.body !== 'string' && !(opts.body instanceof FormData) ? JSON.stringify(opts.body) : opts.body});
  if (!r.ok) { const t = await r.text(); let m = t; try { m = JSON.parse(t).detail } catch(e){} alert(m); throw new Error(m); }
  return r.json();
}
async function load() { S = await api('/api/state'); render(); }
function connect() {
  const es = new EventSource('/api/events');
  es.onmessage = () => { if (!editing) load(); };
  es.onerror = () => { es.close(); setTimeout(connect, 2000); };
}

const fmtTime = iso => iso ? new Date(iso).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}) : '';
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString([], {month:'short', day:'numeric'}) : '';
const leaveTxt = p => !p ? '—' : p.strike ? 'X' : p.standing.join('-');
const metricVal = (c, k) => { const m = (c.metrics || []).find(x => x.key === k); return m && m.value != null ? m.value : null; };
const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
const sd = a => { if (a.length < 2) return null; const m = avg(a); return Math.sqrt(avg(a.map(x=>(x-m)**2))); };
const pct = (a,b) => b ? Math.round(100*a/b) : null;

function current() {
  if (!S || !S.cards.length) return null;
  if (follow || !S.cards.find(c => c.id === selected)) selected = S.cards[S.cards.length-1].id;
  return S.cards.find(c => c.id === selected);
}

// cards within the selected range (All / First half / Second half / Last 5), by shot number
function rangeCards() {
  const cs = S.cards;
  if (range === 'last5') return cs.slice(-5);
  if (range === 'first') return cs.slice(0, Math.ceil(cs.length/2));
  if (range === 'second') return cs.slice(Math.ceil(cs.length/2));
  return cs;
}

function render() {
  const sess = S.session;
  $('#speechBtn').className = 'btn' + (S.speech ? ' on' : '');
  $('#speechBtn').disabled = !S.speech_available;
  $('#speechBtn').title = S.speech_available ? 'Read results aloud' : 'Speech needs macOS "say"';
  $('#speechBtn').textContent = S.speech ? 'Speech on' : 'Speech off';
  $('#endBtn').style.display = sess ? '' : 'none';
  renderHeaderStatus();
  if (!sess) { $('#sessmeta').innerHTML = ''; renderStart(); return; }
  const st = S.stats || {};
  $('#sessmeta').innerHTML = `
    <div style="font:600 18px var(--sans)">${esc(cap(sess.kind))} · ${fmtDate(sess.started_at)}</div>
    <div class="small muted">${[sess.ball_name && esc(sess.ball_name) + (sess.ball_weight_lb ? ' ' + sess.ball_weight_lb + ' lb' : ''),
      sess.pattern_name && esc(sess.pattern_name) + (sess.pattern_length_ft ? ' ' + sess.pattern_length_ft + ' ft' : ''),
      'started ' + fmtTime(sess.started_at), (st.shots || 0) + ' shot' + (st.shots === 1 ? '' : 's')].filter(Boolean).join(' · ')}</div>`;
  const c = current();
  $('#app').innerHTML = `
    ${S.watch_error ? `<div class="warnbox" style="margin:14px 24px 0">${esc(S.watch_error)}</div>` : ''}
    <main style="max-width:1500px;margin:0 auto;padding:18px 24px;display:flex;flex-direction:column;gap:16px">
      ${renderOverview(st)}
      <div style="display:flex;flex-wrap:wrap;gap:16px">
        <section class="panel" style="flex:999 1 640px;display:flex;flex-direction:column;gap:14px">${renderLatest(c)}</section>
        <aside class="panel" style="flex:1 1 330px;display:flex;flex-direction:column;gap:16px">${renderInputs(sess, c)}</aside>
      </div>
      ${renderShots()}
      <div style="display:flex;flex-wrap:wrap;gap:16px">
        <section class="panel" style="flex:999 1 560px">${renderChart()}</section>
        <section class="panel" style="flex:1 1 520px;display:flex;flex-wrap:wrap;gap:16px">${renderLaneUsage(st)}</section>
      </div>
    </main>`;
  bind(sess, c);
}
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;

function renderHeaderStatus() {
  const el = $('#hstatus'); if (!S.session) { el.innerHTML = ''; return; }
  const watch = S.watch_error
    ? `<span class="pill" style="color:var(--bad);border-color:#5a2222"><span class="dot" style="background:var(--bad)"></span>Watch error</span>`
    : `<span class="pill"><span class="dot" style="background:var(--good)"></span>Watching ${esc(shortPath(S.watch_dir))}</span>`;
  const proc = S.cards.find(c => c.status === 'processing');
  let q = '';
  if (proc) {
    const step = procStep(proc);
    q = `<span class="pill" style="color:var(--warn);border-color:#4A3E18"><span class="spin"></span>Analyzing shot ${proc.n}${step ? ' · ' + esc(step) : ''}</span>`;
  } else if (S.queue) {
    q = `<span class="pill" style="color:var(--warn);border-color:#4A3E18"><span class="spin"></span>${S.queue} queued</span>`;
  }
  el.innerHTML = watch + q;
}
const shortPath = p => { if (!p) return ''; const parts = p.replace(/\/$/,'').split('/'); return '~/' + parts.slice(-1)[0]; };
function procStep(c) {  // latest pipeline step while processing (available once steps are streamed; see step 5)
  const steps = (c.timings || {}).steps; if (!steps || !steps.length) return '';
  return steps[steps.length-1].msg;
}

/* ---------- session overview KPIs ---------- */
function kpisFrom(cards) {
  const done = cards.filter(c => c.status === 'done');
  const first = done.filter(c => c.kind === 'first' && c.pins);
  const spare = done.filter(c => c.kind === 'spare' && c.pins);
  const strikes = first.filter(c => c.pins.strike);
  const pocket = first.filter(c => (c.hit || {}).hit === 'pocket');
  const carried = pocket.filter(c => c.pins.strike);
  const made = spare.filter(c => c.pins.strike);
  const col = (k, cards=first) => cards.map(c => metricVal(c, k)).filter(v => v != null);
  const powers = first.map(c => (c.power || {}).value).filter(v => v != null);
  const spreads = ['arrows_board','breakpoint_board','entry_board'].map(k => col(k)).filter(a => a.length >= 3).map(sd);
  const rep = spreads.length ? Math.round(100 * Math.exp(-(avg(spreads)) / 2)) : null;
  const marks = first.map(c => c.hit_mark);
  return { first: first.length, spare: spare.length, strikes: strikes.length, strike_pct: pct(strikes.length, first.length),
    pocket_pct: pct(pocket.length, first.length), carry_pct: pct(carried.length, pocket.length),
    spare_pct: pct(made.length, spare.length), spares_made: made.length,
    speed: avg(col('ball_speed')), speed_sd: sd(col('ball_speed')),
    rev: avg(col('rev_rate')), power: powers.length ? Math.round(avg(powers)) : null,
    power_min: powers.length ? Math.min(...powers) : null, power_max: powers.length ? Math.max(...powers) : null,
    rep, entry_sd: col('entry_board').length >= 2 ? sd(col('entry_board')) : null,
    hit_yes: marks.filter(m => m === 'yes').length, hit_no: marks.filter(m => m === 'no').length,
    hit_marked: marks.filter(Boolean).length };
}
function renderOverview(st) {
  const k = kpisFrom(rangeCards());
  const prev = (range === 'all' && S.prev_stats) ? S.prev_stats : null;
  const d1 = (cur, was, suf='') => (cur == null || was == null) ? '' : `${cur - was >= 0 ? '+' : ''}${(cur - was).toFixed(suf === 'mph' ? 1 : 0)} vs last`;
  const tiles = [
    kpi('Avg speed', fmt(k.speed, 1), 'mph', '✓', 'ok', prev ? d1(k.speed, (prev.averages.ball_speed || {}).mean, 'mph') : (k.speed_sd != null ? `± ${k.speed_sd.toFixed(1)}` : '')),
    kpi('Avg rev rate', fmt(k.rev, 0), 'rpm', 'est', 'est', prev ? d1(k.rev, (prev.averages.rev_rate || {}).mean) : 'surface periodicity × factor'),
    kpi('Strikes', k.strike_pct == null ? '—' : k.strike_pct, k.strike_pct == null ? '' : `% · ${k.strikes}/${k.first}`, '✓', 'ok',
        k.pocket_pct == null ? 'no first balls yet' : `Pocket ${k.pocket_pct}%${k.carry_pct != null ? ' · carry ' + k.carry_pct + '%' : ''}`, '#4BE0A0'),
    kpi('Spares', k.spare_pct == null ? '—' : k.spare_pct, k.spare_pct == null ? '' : `% · ${k.spares_made}/${k.spare}`, '✓', 'ok',
        k.spare == null || k.spare === 0 ? 'no spare attempts' : `${k.spares_made} of ${k.spare} made`),
    kpi('Avg Power', k.power == null ? '—' : k.power, '', 'est', 'est', k.power == null ? 'needs speed + revs' : `Range ${k.power_min} to ${k.power_max}`),
    kpi('Repeatability', k.rep == null ? '—' : k.rep, k.rep == null ? '' : '/100', '✓', 'ok',
        k.rep == null ? 'needs 3+ first balls' : (k.entry_sd != null ? `Entry spread ±${k.entry_sd.toFixed(1)} bd` : '')),
    kpi('Hit your mark', k.first ? k.hit_yes : '—', k.first ? '/ ' + k.first : '', 'you', 'you',
        k.hit_marked ? `${k.hit_no} miss${k.hit_no === 1 ? '' : 'es'} kept off the lane read` : 'mark your shots to track this'),
  ];
  return `<section class="panel">
    <div class="rowline" style="margin-bottom:14px">
      <h2 class="h" style="margin:0">Session overview</h2><div style="flex:1"></div>
      <div class="rowline" style="gap:6px" role="group" aria-label="Range">
        ${[['all','All'],['first','First half'],['second','Second half'],['last5','Last 5']].map(([v,l]) =>
          `<button class="tab ${range===v?'on':''}" data-range="${v}" type="button">${l}</button>`).join('')}</div>
      <a href="/api/sessions/${S.session.id}/export.csv" class="small">Export CSV</a>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px">${tiles.join('')}</div>
  </section>`;
}
const fmt = (v, d) => v == null ? '—' : v.toFixed(d);
function kpi(label, value, unit, badge, cls, delta, deltaColor) {
  return `<div class="kpi">
    <div style="display:flex;justify-content:space-between;align-items:center"><span class="lbl">${label}</span><span class="badge ${cls}">${badge}</span></div>
    <div class="v num">${value}${unit ? `<small>${unit}</small>` : ''}</div>
    <div style="font-size:12px;color:${deltaColor || 'var(--muted)'}">${esc(delta || '')}</div>
  </div>`;
}

/* ---------- latest shot ---------- */
function renderLatest(c) {
  if (!c) return `<div class="noreplay">Waiting for the first clip.<br><br>AirDrop a shot to this Mac or drag a clip onto the page.</div>`;
  const i = S.cards.findIndex(x => x.id === c.id);
  const head = `<div class="rowline">
      <h2 class="h" style="margin:0">Latest shot · #${c.n} · ${c.kind === 'spare' ? 'spare attempt' : 'first ball'}</h2>
      <div style="flex:1"></div>
      <button class="btn" data-nav="-1" type="button" aria-label="Previous shot" ${i<=0?'disabled':''}>&#8249;</button>
      <span class="small muted">${c.n} of ${S.cards.length} · ${fmtTime(c.created_at)}</span>
      <button class="btn" data-nav="1" type="button" aria-label="Next shot" ${i>=S.cards.length-1?'disabled':''}>&#8250;</button>
      ${!follow ? `<button class="btn" id="latestBtn" type="button">Latest</button>` : ''}</div>`;
  if (c.status === 'queued' || c.status === 'processing')
    return head + `<div class="status"><div class="bigspin"></div><div>${c.status === 'queued' ? 'Queued' : 'Analyzing…'}</div>
      <div class="small muted">${esc(c.original_name || '')}</div>${procStep(c) ? `<div class="small dim">${esc(procStep(c))}</div>` : ''}</div>`;
  if (c.status === 'failed')
    return head + `<div class="status"><div style="font-size:30px;font-weight:700" class="err">Not analyzed</div><p class="err">${esc(c.error)}</p>
      <button class="btn" id="retryBtn" type="button">Retry</button></div>`;
  return head + `<div style="display:flex;flex-wrap:wrap;gap:16px">
    <div style="flex:1 1 300px;display:flex;flex-direction:column;gap:10px;min-width:0">${renderMedia(c)}</div>
    <div style="flex:999 1 380px;display:flex;flex-direction:column;gap:12px;min-width:0">
      ${renderResult(c)}${renderAdj(c)}${renderMetrics(c)}
    </div></div>`;
}

function renderMedia(c) {
  if (c.status !== 'done') return `<div class="media"><div class="noreplay">Replay renders after analysis</div></div>`;
  const tabs = `<div style="display:flex;gap:6px" role="tablist">
      <button class="tab ${mediaTab==='video'?'on':''}" data-media="video" type="button">Video + path</button>
      <button class="tab ${mediaTab==='topdown'?'on':''}" data-media="topdown" type="button">Top-down</button></div>`;
  if (mediaTab === 'topdown')
    return tabs + `<div class="media"><img src="/api/shots/${c.id}/replay.png?v=${S.version}" alt="Top-down replay of shot ${c.n}"></div>`;
  return tabs + `<div class="media" id="vwrap">
      <video id="vid" src="/api/shots/${c.id}/video" playsinline muted preload="auto" style="width:100%;display:block"></video>
      <canvas id="vcanvas" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"></canvas>
      <div id="vnote" style="position:absolute;left:10px;top:10px;right:10px;font-size:12px;color:#F5CF5B;display:none"></div>
      <div style="position:absolute;left:10px;bottom:10px;display:flex;gap:12px;font-size:12px;color:#C3CEDD;background:#05090Fcc;padding:6px 9px;border-radius:7px">
        <span><span style="display:inline-block;width:18px;height:3px;background:#00C2EE;vertical-align:middle"></span> Tracked path</span>
        <span><span style="display:inline-block;width:18px;border-top:2px dashed #F7F9FC;vertical-align:middle"></span> Your target line</span></div>
      <button class="btn" id="playBtn" type="button" style="position:absolute;right:10px;top:10px;min-height:36px;padding:6px 10px;font-size:13px">Play 0.25×</button>
    </div>`;
}

function proj(H, b, z) {   // lane (board, z ft) -> image pixel
  const x = H[0][0]*b + H[0][1]*z + H[0][2], y = H[1][0]*b + H[1][1]*z + H[1][2], w = H[2][0]*b + H[2][1]*z + H[2][2];
  return [x/w, y/w];
}
async function setupVideoOverlay(c) {
  const vid = $('#vid'), cv = $('#vcanvas'), note = $('#vnote'), play = $('#playBtn');
  if (!vid || !cv) return;
  if (play) play.onclick = () => { if (vid.paused) { vid.playbackRate = 0.25; vid.play(); play.textContent = 'Pause'; } else { vid.pause(); play.textContent = 'Play 0.25×'; } };
  if (trajCache[c.id] === undefined) { try { trajCache[c.id] = await api(`/api/shots/${c.id}/trajectory`); } catch(e) { trajCache[c.id] = null; } }
  const tj = trajCache[c.id];
  const moved = tj && tj.camera_motion_px != null && tj.camera_motion_px >= 25;
  if (note) {
    if (!tj || !tj.pixel || !tj.pixel.length) { note.style.display = 'block'; note.textContent = 'No tracked path for this shot.'; }
    else if (moved) { note.style.display = 'block'; note.textContent = `Camera moved ${Math.round(tj.camera_motion_px)} px — path overlay needs a steady camera. Use Top-down.`; }
  }
  const draw = () => {
    const ctx = cv.getContext('2d'); ctx.clearRect(0, 0, cv.width, cv.height);
    if (!tj || !tj.pixel || !tj.pixel.length || moved) return;
    const P = tj.pixel, H = tj.lane_to_image, it = (S.session || {}).intent || {}, kp = tj.key_points || {};
    // target line from your intent, projected through the lane homography
    if (H && it.laydown_board != null && it.arrows_board != null && it.breakpoint_board != null) {
      const bpz = (kp.breakpoint || {}).z_ft || 38;
      const tp = [[it.laydown_board,0],[it.arrows_board,15],[it.breakpoint_board,bpz]].map(([b,z]) => proj(H,b,z));
      ctx.strokeStyle = '#F7F9FC'; ctx.lineWidth = Math.max(cv.width/360, 2); ctx.setLineDash([12,10]); ctx.globalAlpha = .85;
      ctx.beginPath(); tp.forEach(([x,y],i) => i?ctx.lineTo(x,y):ctx.moveTo(x,y)); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
    }
    // tracked ball path
    ctx.strokeStyle = '#00C2EE'; ctx.lineWidth = Math.max(cv.width/180, 3); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath(); P.forEach((p,i) => i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.stroke();
    // key-point markers + labels
    if (H) { const F = cv.width/22;
      ctx.font = `600 ${Math.round(F)}px -apple-system,sans-serif`; ctx.textBaseline = 'middle';
      const marks = [['Laydown', kp.laydown], ['Arrows', kp.arrows], ['Breakpoint', kp.breakpoint], ['Entry', kp.entry]];
      marks.forEach(([lab, k]) => { if (!k || k.board == null) return; const [x,y] = proj(H, k.board, k.z_ft);
        ctx.fillStyle = '#F7F9FC'; ctx.beginPath(); ctx.arc(x, y, F*0.3, 0, 7); ctx.fill();
        const txt = `${lab} ${k.board.toFixed(1)}${k.angle_deg!=null?' · '+k.angle_deg.toFixed(1)+'°':''}`;
        const tw = ctx.measureText(txt).width, lx = lab === 'Entry' ? x - tw - F*0.6 : x + F*0.6;
        ctx.fillStyle = '#05090Fcc'; ctx.fillRect(lx - 4, y - F*0.7, tw + 8, F*1.4);
        ctx.fillStyle = '#F7F9FC'; ctx.fillText(txt, lx, y); });
    }
    // moving ball marker at the current video time
    const t = vid.currentTime;
    if (t > 0) { let bp = null;
      for (const p of P) { if (p.t <= t) bp = p; else break; }
      if (bp) { ctx.fillStyle = '#fff'; ctx.strokeStyle = '#04121F'; ctx.lineWidth = cv.width/180;
        ctx.beginPath(); ctx.arc(bp.x, bp.y, cv.width/55, 0, 7); ctx.fill(); ctx.stroke(); }
    }
  };

}

function shotTag(c) {

function renderShots() {

  const filters = [['all','All',cs.length],['strike','Strikes',counts.strike],['leave','Leaves',counts.leave],['spare','Spares',counts.spare],['review','Needs review',counts.review]];

  if (!sd.some(s => s.pts.length)) return head + `<div class="muted" style="padding:20px 0">No data yet for this series.</div>`;
  const W = 680, H = 240, T = 18, B = 42, L = 46, R = def.axes === 2 ? 632 : 648;
  const ns = done.map(c => c.n); let xmin = Math.min(...ns), xmax = Math.max(...ns); if (xmin === xmax) { xmin -= 0.5; xmax += 0.5; }
  const X = n => L + (n - xmin) / (xmax - xmin) * (R - L);
  const scale = idx => { const vs = sd.filter(s => (s.axis||0) === idx).flatMap(s => s.pts.map(p => p.v)); if (!vs.length) return null;
    let lo = Math.min(...vs), hi = Math.max(...vs); if (lo === hi) { lo -= 1; hi += 1; } const pad = (hi-lo)*0.18; lo -= pad; hi += pad;
    return { lo, hi, y: v => (H-B) - (v-lo)/(hi-lo)*((H-B)-T) }; };
  const A = [scale(0), def.axes === 2 ? scale(1) : null];
  const ticks = (a, x, anchor) => { if (!a) return ''; const out = [];
    for (let i = 0; i <= 3; i++) { const v = a.lo + (a.hi-a.lo)*i/3, y = a.y(v);
      out.push(`<text x="${x}" y="${(y+4).toFixed(1)}" fill="#93A3BA" font-size="11" text-anchor="${anchor}">${chartTab==='speedrev'&&anchor==='end'?v.toFixed(1):Math.round(v)}</text>`); }
    return out.join(''); };
  const grid = [0,1,2,3].map(i => { const y = (A[0].y(A[0].lo + (A[0].hi-A[0].lo)*i/3)).toFixed(1); return `M${L},${y}H${R}`; }).join('');
  const half = X((xmin+xmax)/2).toFixed(1);
  const paths = sd.map(s => { const a = A[s.axis||0]; if (!a || !s.pts.length) return '';
    const pl = s.pts.map(p => `${X(p.n).toFixed(1)},${a.y(p.v).toFixed(1)}`).join(' ');
    const dots = s.pts.map(p => `<circle cx="${X(p.n).toFixed(1)}" cy="${a.y(p.v).toFixed(1)}" r="3.5" fill="${s.color}"></circle>`).join('');
    return `<polyline points="${pl}" fill="none" stroke="${s.color}" stroke-width="2.5"></polyline>${dots}`; }).join('');
  const xlabels = [xmin, Math.round((xmin+xmax)/2), xmax].filter((v,i,a)=>a.indexOf(v)===i).map(n =>
    `<text x="${X(n).toFixed(1)}" y="${H-24}" fill="#93A3BA" font-size="11" text-anchor="middle">${n}</text>`).join('');
  const legend = sd.map(s => `<span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${s.color}"></span> ${s.label}</span>`).join('');
  return head + `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Shot by shot ${def.tabs}">
      <path d="${grid}" stroke="#1F2E45" fill="none"></path>
      ${ticks(A[0], L-6, 'end')}${A[1] ? ticks(A[1], R+6, 'start') : ''}${xlabels}
      <text x="${(L+R)/2}" y="${H-8}" fill="#93A3BA" font-size="11" text-anchor="middle">Shot</text>
      ${done.length>2 ? `<line x1="${half}" x2="${half}" y1="${T}" y2="${H-B}" stroke="#2D4363" stroke-dasharray="4 4"></line>` : ''}
      ${paths}</svg>
    <div class="rowline" style="gap:18px;font-size:13px;color:#C3CEDD;margin-top:4px">${legend}${done.length>2?'<span style="color:#93A3BA">Dashed: half-way split</span>':''}</div>`;
}

/* ---------- lane usage + lane read ---------- */
function renderLaneUsage(st) {
  const firsts = S.cards.filter(c => c.status === 'done' && c.kind === 'first' && c.path && c.path.length);
  const cons = st.consistency || {};
  const W = 160, H = 520, mx = 20, my = 20, lw = W - 2*mx, lh = H - 2*my;
  const bx = b => mx + (39 - b) / 38 * lw;          // board 39 at left, 1 at right (1 = right gutter)
  const zy = z => (H - my) - z / 60 * lh;           // 0 ft at foul (bottom), 60 ft at pins (top)
  const pathD = p => p.map((pt, i) => `${i?'L':'M'}${bx(pt[1]).toFixed(1)},${zy(pt[0]).toFixed(1)}`).join('');
  const latestId = firsts.length ? firsts[firsts.length-1].id : null;
  const others = firsts.filter(c => c.id !== latestId).map(c => `<path d="${pathD(c.path)}" fill="none" stroke="#BFD3EA" stroke-width="1.4" stroke-linecap="round" opacity=".5"></path>`).join('');
  const latest = firsts.find(c => c.id === latestId);
  const ell = cons.breakpoint_ellipse;
  const ellSvg = ell ? (() => { const [cb, cz] = ell.center, [ax, ay] = ell.axes;
    return `<ellipse cx="${bx(cb).toFixed(1)}" cy="${zy(cz).toFixed(1)}" rx="${(ax/38*lw).toFixed(1)}" ry="${(ay/60*lh).toFixed(1)}" transform="rotate(${-ell.angle_deg} ${bx(cb).toFixed(1)} ${zy(cz).toFixed(1)})" fill="#F5CF5B33" stroke="#F5CF5B" stroke-width="1.5"></ellipse>`; })() : '';
  const svg = `<svg viewBox="0 0 ${W} ${H}" width="160" role="img" aria-label="Top-down lane with first-ball paths">
      <rect x="${mx}" y="${my}" width="${lw}" height="${lh}" fill="#6B4A26"></rect>
      <rect x="${mx-8}" y="${my}" width="8" height="${lh}" fill="#2A3240"></rect><rect x="${mx+lw}" y="${my}" width="8" height="${lh}" fill="#2A3240"></rect>
      ${ellSvg}${others}
      ${latest ? `<path d="${pathD(latest.path)}" fill="none" stroke="#00C2EE" stroke-width="3" stroke-linecap="round"></path>` : ''}
      <text x="${W/2}" y="13" fill="#93A3BA" font-size="11" text-anchor="middle">pins</text>
      <text x="${W/2}" y="${H-4}" fill="#93A3BA" font-size="11" text-anchor="middle">foul line</text></svg>`;
  const disp = cons.dispersion_boards || {};
  const spread = ['arrows','breakpoint','entry'].map(k => `<div style="background:var(--tile);border:1px solid var(--tileline);border-radius:9px;padding:8px 10px">
      <div class="lbl">${cap(k)}</div><div class="num" style="font-size:21px;font-weight:700">${disp[k]!=null?'±'+disp[k]:'—'}<span style="font-size:12px;color:var(--muted)"> bd</span></div></div>`).join('');
  const takeaways = laneReadTakeaways(st);
  return `<div style="flex:0 0 170px"><h2 class="h">Lane usage</h2>${svg}</div>
    <div style="flex:1 1 260px;display:flex;flex-direction:column;gap:12px;min-width:0">
      <h2 class="h" style="margin:0">Lane read</h2>
      <div style="display:flex;flex-direction:column;gap:10px">${takeaways.length ? takeaways.map(t => `<div style="display:flex;gap:10px">
          <span style="flex:0 0 8px;height:8px;margin-top:7px;border-radius:50%;background:${t.color}"></span>
          <div><div style="font-weight:600">${esc(t.title)}</div><div style="font-size:13px;color:#A9B6C9">${esc(t.body)}</div></div></div>`).join('')
        : `<div class="muted small">Takeaways appear as the session builds (3+ comparable first balls).</div>`}</div>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:auto">${spread}</div>
      <div class="lbl">${ell ? 'Yellow ellipse: where your breakpoints landed (2σ). ' : ''}Spread = how repeatable each checkpoint is${cons.dispersion_boards?'':' (needs 3+ first balls)'}.</div>
    </div>`;
}
function laneReadTakeaways(st) {
  const out = [];
  // lane transition: surface a transition recommendation if the engine found one on a recent first ball
  const tr = [...S.cards].reverse().find(c => c.kind === 'first' && ((c.insights || {}).recommendations || []).some(r => r.type === 'transition'));
  if (tr) { const r = tr.insights.recommendations.find(x => x.type === 'transition'); out.push({ color: '#F5CF5B', title: 'Lane is transitioning', body: r.reason }); }
  const a = st.averages || {};
  if (a.ball_speed && a.ball_speed.n >= 2) out.push({ color: '#3FD8FF', title: 'Speed ' + (a.ball_speed.sd <= 0.3 ? 'is steady' : 'is varying'),
    body: `${a.ball_speed.mean.toFixed(1)} mph ± ${a.ball_speed.sd.toFixed(1)} on first balls.` });
  if (a.breakpoint_board && a.breakpoint_board.n >= 2) { const len = (S.session || {}).pattern_length_ft;
    const target = (S.session.intent || {}).breakpoint_board ?? (len ? len - 31 : null);
    out.push({ color: '#3FD8FF', title: 'Breakpoint', body: `Average ${a.breakpoint_board.mean.toFixed(1)}${target!=null?` vs your target ${target}`:''}.${len?` Pattern rule for ${len} ft says ${len-31}.`:''}` });
  }
  return out;
}

/* ---------- start session ---------- */
function renderStart() {
  $('#hstatus').innerHTML = '';
  const prev = S.sessions[0] || {};
  $('#app').innerHTML = `<main style="max-width:1500px;margin:0 auto;padding:18px 24px"><div class="panel start">
    <h2 class="h">Start a session</h2>
    <div class="row2" style="margin-bottom:10px">
      <label class="lbl">Type<select class="fld" id="s_kind"><option>practice</option><option>league</option><option>tournament</option></select></label>
      <label class="lbl">Hand<select class="fld" id="s_hand"><option value="">Auto from video</option><option value="R">Right</option><option value="L">Left</option></select></label>
      <label class="lbl">Ball<input class="fld" id="s_ball" placeholder="e.g. Phaze II" value="${esc(prev.ball_name || '')}"></label>
      <div class="row2"><label class="lbl">Weight lb<input class="fld" id="s_wt" type="number" step="0.5" placeholder="15"></label>
        <label class="lbl">RG in<input class="fld" id="s_rg" type="number" step="0.01" placeholder="2.50"></label></div>
      <label class="lbl">Oil pattern<input class="fld" id="s_pat" placeholder="House shot"></label>
      <label class="lbl">Pattern length ft<input class="fld" id="s_len" type="number" step="1" placeholder="optional"></label>
    </div>
    <p class="small muted">Record each shot on the iPhone (1080p, 60 fps, tripod, HDR off) and AirDrop it to this Mac. Clips in
      <span class="kbd">${esc(S.watch_dir || '')}</span> are picked up automatically, or drag a clip onto this page.</p>
    <button class="btn primary" id="startBtn" type="button">Start session</button>
    ${S.sessions.length ? `<div style="margin-top:16px;border-top:1px solid var(--line);padding-top:12px"><h2 class="h">Past sessions</h2>${S.sessions.map(s =>
      `<div class="varrow" style="padding:4px 0"><span>#${s.id} ${esc(s.kind)} · ${new Date(s.started_at).toLocaleString()} · ${esc(s.ball_name || '')}</span>
       <span>${s.shot_count} shots · <a href="/api/sessions/${s.id}/export.csv">CSV</a></span></div>`).join('')}</div>` : ''}
  </div></main>`;
  $('#startBtn').onclick = async () => {
    const num = id => { const v = $(id).value; return v === '' ? null : parseFloat(v); };
    await api('/api/session', {method:'POST', body:{kind:$('#s_kind').value, handed:$('#s_hand').value || null,
      ball_name:$('#s_ball').value || null, ball_weight_lb:num('#s_wt'), ball_rg_in:num('#s_rg'),
      pattern_name:$('#s_pat').value || null, pattern_length_ft:num('#s_len')}});
    follow = true; load();
  };
}

/* ---------- bind ---------- */
function bind(sess, c) {
  document.querySelectorAll('[data-range]').forEach(b => b.onclick = () => { range = b.dataset.range; render(); });
  document.querySelectorAll('[data-filter]').forEach(b => b.onclick = () => { shotFilter = b.dataset.filter; render(); });
  document.querySelectorAll('[data-chart]').forEach(b => b.onclick = () => { chartTab = b.dataset.chart; render(); });
  document.querySelectorAll('[data-shot]').forEach(el => el.onclick = () => {
    selected = +el.dataset.shot; follow = selected === S.cards[S.cards.length-1].id; render(); });
  document.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => navShot(+b.dataset.nav));
  document.querySelectorAll('[data-media]').forEach(b => b.onclick = () => { mediaTab = b.dataset.media; render(); });
  if (c && c.status === 'done' && mediaTab === 'video') setupVideoOverlay(c);
  const lb = $('#latestBtn'); if (lb) lb.onclick = () => { follow = true; render(); };
  const rb = $('#retryBtn'); if (rb) rb.onclick = () => api(`/api/shots/${c.id}/retry`, {method:'POST'});
  document.querySelectorAll('input,select').forEach(i => { i.onfocus = () => editing = true; i.onblur = () => editing = false; });
  const num = id => { const v = $(id).value; return v === '' ? null : parseFloat(v); };
  const ss = $('#saveSess'); if (ss) ss.onclick = () => api('/api/session', {method:'PATCH', body:{
    intent:{laydown_board:num('#i_lay'), arrows_board:num('#i_arr'), breakpoint_board:num('#i_bp')},
    ball_name:$('#i_ball').value || null, ball_weight_lb:num('#i_wt')}}).then(load);
  if (!c || c.status !== 'done') return;
  const post = body => api(`/api/shots/${c.id}`, {method:'POST', body}).then(load);
  document.querySelectorAll('[data-hm]').forEach(b => b.onclick = () => post({hit_mark: c.hit_mark === b.dataset.hm ? null : b.dataset.hm}));
  document.querySelectorAll('[data-pin]').forEach(b => b.onclick = () => {
    const s = new Set(c.pins ? c.pins.standing : []); const n = +b.dataset.pin; s.has(n) ? s.delete(n) : s.add(n); post({pins_override:[...s]}); });
  const pr = $('#pinReset'); if (pr) pr.onclick = () => post({clear_pins_override:true});
  document.querySelectorAll('[data-kind]').forEach(b => b.onclick = () => post({kind_override:b.dataset.kind}));
  const sv = $('#saveSensor'); if (sv) sv.onclick = () => { const o = {}; document.querySelectorAll('[data-s]').forEach(i => o[i.dataset.s] = i.value === '' ? null : parseFloat(i.value)); post({sensor:o}); };
  document.querySelectorAll('[data-vote]').forEach(b => b.onclick = () => post({rec_vote: c.rec_vote === b.dataset.vote ? null : b.dataset.vote}));
  document.querySelectorAll('[data-fol]').forEach(b => b.onclick = () => post({rec_followed: c.rec_followed === b.dataset.fol ? null : b.dataset.fol}));
  const rn = $('#recNote'); if (rn) rn.onchange = () => post({rec_note: rn.value || null});
}
function navShot(d) {
  const i = S.cards.findIndex(x => x.id === selected);
  const j = Math.max(0, Math.min(S.cards.length-1, i + d));
  selected = S.cards[j].id; follow = j === S.cards.length-1; render();
}

document.addEventListener('keydown', e => {
  if (!S || !S.session || ['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  const c = current(); const k = e.key.toLowerCase();
  if (c && c.status === 'done' && {y:'yes', n:'no', u:'unsure'}[k])
    api(`/api/shots/${c.id}`, {method:'POST', body:{hit_mark:{y:'yes', n:'no', u:'unsure'}[k]}}).then(load);
  else if (k === 'arrowleft') navShot(-1);
  else if (k === 'arrowright') navShot(1);
});
$('#speechBtn').onclick = () => api(`/api/speech?on=${!S.speech}`, {method:'POST'}).then(load);
$('#endBtn').onclick = () => { if (confirm('End this session?')) api('/api/session/end', {method:'POST'}).then(load); };

let dragDepth = 0;
addEventListener('dragenter', e => { e.preventDefault(); if (S && S.session) { dragDepth++; $('#drop').style.display = 'flex'; } });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('#drop').style.display = 'none'; } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', async e => {
  e.preventDefault(); dragDepth = 0; $('#drop').style.display = 'none';
  if (!S || !S.session) return;
  for (const f of e.dataTransfer.files) { const fd = new FormData(); fd.append('file', f);
    await fetch('/api/upload', {method:'POST', body:fd}).then(async r => { if (!r.ok) alert((await r.json()).detail); }); }
  follow = true; load();
});

load().then(connect);
</script>
</body>
</html>
