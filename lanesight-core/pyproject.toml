[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lanesight-core"
version = "0.6.0"
description = "LaneSight back end: video ball tracking, shot metrics, pin reading, scoring/stats, insights, replay"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "opencv-python-headless>=4.9", "matplotlib>=3.8"]
[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
form = ["mediapipe>=0.10"]       # rear/bowler-side Form P1 pose backend (lanesight_core.form.pose)
runner = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "pyjwt[crypto]>=2.8"]
[tool.setuptools.packages.find]
include = ["lanesight_core*", "lanesight_runner*", "lanesight_api*"]

[tool.setuptools.package-data]
lanesight_runner = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
